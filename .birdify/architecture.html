he current subset. `files` is the current step's concrete\n> file list. For `planned`/`editing`, every mapped owner must be in `targets`.\n> Unmapped paths must be reported exactly in `unmappedFiles` for every phase.\n> \n> `checks` contains command, nullable exit code and `passed|failed|not-run` status.\n> Passed requires exit code 0, failed requires a nonzero exit code, and not-run\n> requires null. No checks means no verification claim. `completed` can describe\n> an untested change, but cannot include a failed check. A `failed` event may have\n> no checks when failure occurred before verification.\n> \n> Session rules:\n> \n> - The first event has sequence 1; following sequences are contiguous.\n> - A session belongs to one project and map revision.\n> - A new task begins with `planned`; only one task is active at a time.\n> - Active tasks accept `planned`, `editing`, `verifying`, or a terminal event.\n> - `planned` can revise scope. Every other event preserves the latest plan scope.\n> - Terminal phases are `completed`, `failed`, `cancelled`; task IDs cannot reopen.\n> - Targets must belong to scope. Terminal events may have empty targets.\n> \n> These are authoring consistency rules, not enforcement of coding permissions.\n> The validator reports an error code and location; an invalid input is never\n> silently repaired. Neither contract defines HTTP endpoints, ports, UI colors or\n> an automatic interception mechanism.\n> \n> ## Visual contract\n> \n> Optional local-constraint discovery, rule scope, applicability and per-event verification records follow [Effective constraints](constraints.md). They preserve legacy map/event compatibility and never establish automatic enforcement.\n> \n> Every relationship requires `kind` and `visibility`. `kind` is `request` (invoke\n> an operation), `result` (return its outcome), `dependency` (use a capability or\n> resource), `event` (publish a notification/state record), or `control` (schedule,\n> approve, cancel or otherwise govern execution). These describe the authored arrow;\n> they do not prove synchronous execution or imply an unrecorded reverse edge.\n> `visibility` is `overview` or `detail`. Overview initially displays only\n> `overview` relationships; All displays every relationship. Missing fields and\n> the removed `primary` field are invalid; no legacy fallback is supported.\n> All modules keep their positions and stay\n> available. Hover temporarily reveals every direct relationship of that module,\n> including auxiliary ones, and dims unrelated context. The visible/total count\n> reflects this reveal. This is a reading aid, never an activity scope or new edge.\n> \n> Render modules at stable grid positions; preserve them across activity updates.\n> Use a persistent outline for planned scope, highest emphasis for current targets,\n> and reduced emphasis for unrelated modules. Keep module names readable. Display\n> planned-event targets with the same emphasis before editing starts. Verification\n> targets must be identified as verification, not editing. Comparison panes share\n> positions and navigation, with activity emphasis only on the changes pane.\n> Display\n> reason and phase outside the map and reveal files/evidence on module selection.\n> Never imply that all neighbors of a target are being modified. Keep simulation\n> explicitly labelled and separate from real activity."},"directory-source-11":{"body":"# birdify/references/bilingual.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Architecture language selection\n> \n> [中文](bilingual.zh.md)\n> \n> ## Select and author\n> \n> Resolve the delivery language without asking or pausing: explicit output instructions/applicable standing preference, then dominant request prose (ignore code IDs and quoted source). For language-neutral requests, use recent conversation, existing map language, then English. Browser locale and saved UI preferences do not decide authored language.\n> \n> Support any language. Set `language` to the base language tag; single-language maps need no translations. For multiple languages, use the preferred/first-listed language as base and put others in each text-owning object's `translations.\u003clanguage-tag>`. Reuse existing structure, base language and translations; add complete missing delivery translations. Infer an absent base tag from prose, using the delivery language if ambiguous. Saved translation changes increment map revision and respect active task bindings.\n> \n> Describe the same inspected architecture in all languages:\n> \n> - Translate project/group/module names, responsibilities, relationship labels, evidence notes and nonempty `openQuestions`; preserve question order and uncertainty.\n> - Keep names short and responsibilities suitable for two lines, with full text in details. Preserve proper names, IDs, paths, symbols, line numbers, enums and layout.\n> - Use one map; do not invent evidence or remove existing translations unprompted. See [the complete example](../examples/bilingual.architecture.json).\n> - For multilingual activity, translate every supported language's event `translations[locale].reason` and check `translations[locale].summary`; missing values fall back to original text.\n> \n> ## Validate and display\n> \n> ```sh\n> npx --yes @borg0ai/birdify validate \u003cmap.json> --bilingual\n> npx --yes @borg0ai/birdify render \u003cmap.json> \u003carchitecture.html>\n> ```\n> \n> Use `--bilingual` for Chinese/English delivery only. Single-language maps validate without it; other combinations require manual language-coverage review after structural validation. The strict check verifies architecture text coverage and question counts, not translation accuracy or activity translations. Do not claim complete Chinese/English coverage before it passes; inspect both languages' tooltips, details and relationships in the browser, and check activity coverage separately.\n> \n> Open HTML with `#lang=\u003cdelivery-language-tag>`. Display priority is supported URL language, saved preference, then map base (legacy default: Chinese). Switching preserves selection, layout and zoom; missing translations use base text. The selector does not translate content or call a translation API.\n> \n> UI controls are bundled only in Chinese/English; other languages use English controls with authored project text. Do not claim fully localized UI for them. Right-to-left content is supported, but graph/toolbar layout remains left-to-right."}}},"snapshot":"5f00b04a96fdc864f61c108d7f1a950b93c72800","scope":"提炼当前仓库根目录 AGENTS.md 与 CONTRIBUTING.md 中的核心开发、触发、确认与贡献规则","rules":[{"id":"rule-read-before-edit","modules":[]},{"id":"rule-on-demand-trigger","modules":[]},{"id":"rule-confirm-before-implementation","modules":[]},{"id":"rule-bilingual-commit","modules":[]},{"id":"rule-pair-documentation","modules":[]},{"id":"rule-no-direct-edit-generated","modules":[]}]}};

    history: ["\u8DDF\u8E2A\u8FC7\u7A0B", "\u5386\u53F2\u8BB0\u5F55\u5C55\u793A\u8BA1\u5212\u3001\u7F16\u8F91\u548C\u9A8C\u8BC1\u6B65\u9AA4\u3002\u5C55\u5F00\u8BE6\u60C5\u67E5\u770B\u6587\u4EF6\u548C\u68C0\u67E5\u7ED3\u679C\uFF1B\u4EFB\u52A1\u5B8C\u6210\u4E0D\u4EE3\u8868\u68C0\u67E5\u901A\u8FC7\u3002", "Follow progress", "History shows planning, editing and verification steps. Expand details for files and check results; completion alone does not prove checks passed."]
  };
  var guideIndex = 0;
  var guideSaved;
  var guideTarget;
  var guideFrame = 0;
  var guideViewState = {
    architecture: { mode: "architecture", inspector: false, history: false },
    activity: { mode: "activity", inspector: false, history: false },
    compare: { mode: "compare", inspector: false, history: false },
    details: { mode: "architecture", inspector: true, history: false },
    history: { mode: "activity", inspector: false, history: true }
  };
  function guideLabels() {
    const zh = isChinese2();
    guideLaunch.textContent = zh ? "\u4F7F\u7528\u6307\u5F15" : "Guide";
    query("span", guideInvite).textContent = zh ? "\u4E86\u89E3\u600E\u4E48\u770B\u56FE" : "Learn to read the map";
    $("guide-start").textContent = zh ? "\u5F00\u59CB" : "Start";
    $("guide-dismiss").textContent = zh ? "\u6682\u4E0D" : "Not now";
    for (const [id, labels] of Object.entries({ "guide-close": ["\u5173\u95ED\u6307\u5F15", "Close guide"], "guide-prev": ["\u4E0A\u4E00\u6B65", "Previous"], "guide-skip": ["\u8DF3\u8FC7\u6307\u5F15", "Skip guide"] })) {
      $(id).ariaLabel = required(labels[zh ? 0 : 1]);
      if (id !== "guide-close") $(id).textContent = required(labels[zh ? 0 : 1]);
    }
    const copy = guideCopy[required(guideSteps[guideIndex])];
    $("guide-title").textContent = copy[zh ? 0 : 2];
    $("guide-copy").textContent = copy[zh ? 1 : 3];
    $("guide-count").textContent = zh ? `\u7B2C ${guideIndex + 1} / ${guideSteps.length} \u6B65` : `Step ${guideIndex + 1} of ${guideSteps.length}`;
    $("guide-progress").max = guideSteps.length;
    $("guide-progress").value = guideIndex + 1;
    $("guide-progress").ariaLabel = $("guide-count").textContent;
    buttonById("guide-prev").disabled = guideIndex === 0;
    $("guide-next").textContent = guideIndex === guideSteps.length - 1 ? zh ? "\u5B8C\u6210" : "Done" : zh ? "\u4E0B\u4E00\u6B65" : "Next";
  }
  function positionGuide() {
    if (!guideDialog.open || !guideTarget) return;
    const rect = guideTarget.getBoundingClientRect();
    const w = innerWidth, h = innerHeight;
    const left = Math.max(6, Math.min(w - 12, rect.left - 5));
    const top = Math.max(6, Math.min(h - 12, rect.top - 5));
    const right = Math.max(left + 6, Math.min(w - 6, rect.right + 5));
    const bottom = Math.max(top + 6, Math.min(h - 6, rect.bottom + 5));
    Object.assign($("guide-spot").style, { left: `${left}px`, top: `${top}px`, width: `${right - left}px`, height: `${bottom - top}px` });
    const card = $("guide-card");
    const cw = card.offsetWidth, ch = card.offsetHeight;
    let x = left, y = bottom + 14;
    if (y + ch > h - 12) {
      if (top - ch - 14 >= 12) y = top - ch - 14;
      else if (right + cw + 14 < w - 12) {
        x = right + 14;
        y = top;
      } else {
        x = w - cw - 12;
        y = h - ch - 12;
      }
    }
    card.style.left = `${Math.max(12, Math.min(w - cw - 12, x))}px`;
    card.style.top = `${Math.max(12, Math.min(h - ch - 12, y))}px`;
  }
  function showGuideStep() {
    const saved = required(guideSaved);
    const step = required(guideSteps[guideIndex]);
    const state = guideViewState[step];
    hoveredModuleId = void 0;
    setInspector(state.inspector);
    activityMode = state.mode;
    if (step === "activity") {
      const plan = activityEvents.findIndex((event) => event.phase === "planned" && event.targets.length);
      activityIndex = plan >= 0 ? plan : saved.index;
    } else activityIndex = saved.index;
    $("activity-disclosure").open = state.history;
    fitting = true;
    updateActivity();
    updateFlow();
    updateZoom();
    if (step === "details") select(map.modules.find((module) => module.id === saved.selected) || required(map.modules[0]));
    guideTarget = step === "details" ? inspector : step === "history" ? activityPanel : step === "compare" ? $("activity-mode") : step === "activity" ? viewport : activityEvents.length ? query('[data-view="architecture"]') : viewport;
    guideTarget.scrollIntoView({ block: "nearest", behavior: "instant" });
    guideLabels();
    positionGuide();
    requestAnimationFrame(positionGuide);
    $("guide-next").focus({ preventScroll: true });
  }
  function dismissGuideInvite() {
    guideInvite.hidden = true;
    try {
      localStorage.setItem(guideKey, "seen");
    } catch {
    }
  }
  function startGuide() {
    if (guideDialog.open) return;
    dismissGuideInvite();
    guideSaved = { mode: activityMode, index: activityIndex, selected: selectedModuleId, inspector: workspace.classList.contains("inspector-open"), zoom, fitting, disclosure: $("activity-disclosure").open, focus: document.activeElement, x: scrollX, y: scrollY, constraints: { open: constraintPanelOpen, selected: selectedConstraintId, filter: constraintFilter }, panes: [...mapPanes.querySelectorAll(".map-scroll")].map((el) => [el, el.scrollLeft, el.scrollTop]) };
    guideIndex = 0;
    constraintPanelOpen = false;
    guideDialog.showModal();
    showGuideStep();
  }
  function finishGuide() {
    if (!guideDialog.open) return;
    guideDialog.close();
    const saved = required(guideSaved);
    activityMode = saved.mode;
    activityIndex = saved.index;
    constraintPanelOpen = saved.constraints.open;
    selectedConstraintId = saved.constraints.selected;
    constraintFilter = saved.constraints.filter;
    fitting = false;
    setInspector(saved.inspector);
    $("activity-disclosure").open = saved.disclosure;
    updateActivity();
    select(map.modules.find((module) => module.id === saved.selected) || required(map.modules[0]));
    zoom = saved.zoom;
    updateZoom();
    fitting = saved.fitting;
    for (const [el, x, y] of saved.panes) el.scrollTo(x, y);
    window.scrollTo(saved.x, saved.y);
    (saved.focus instanceof HTMLElement && saved.focus.isConnected && !saved.focus.closest("#guide-invite") ? saved.focus : guideLaunch).focus({ preventScroll: true });
  }
  guideLaunch.onclick = $("guide-start").onclick = startGuide;
  $("guide-dismiss").onclick = dismissGuideInvite;
  $("guide-close").onclick = $("guide-skip").onclick = finishGuide;
  $("guide-prev").onclick = () => {
    if (guideIndex) {
      guideIndex--;
      showGuideStep();
    }
  };
  $("guide-next").onclick = () => {
    if (guideIndex === guideSteps.length - 1) finishGuide();
    else {
      guideIndex++;
      showGuideStep();
    }
  };
  guideDialog.addEventListener("cancel", (event) => {
    event.preventDefault();
    finishGuide();
  });
  languageSelect.addEventListener("change", () => {
    guideLabels();
    positionGuide();
  });
  var repositionGuide = () => {
    cancelAnimationFrame(guideFrame);
    guideFrame = requestAnimationFrame(positionGuide);
  };
  window.addEventListener("resize", repositionGuide);
  document.addEventListener("scroll", repositionGuide, true);
  new ResizeObserver(repositionGuide).observe($("guide-card"));
  guideLabels();
  if (DATA.constraintView) {
    const view = DATA.constraintView;
    const main = query("body > main");
    const nav = document.createElement("nav");
    nav.id = "project-views";
    const architecture = document.createElement("button");
    const constraints = document.createElement("button");
    architecture.type = constraints.type = "button";
    nav.append(architecture, constraints);
    query("header .task").after(nav);
    main.id = "architecture-view";
    architecture.setAttribute("aria-controls", main.id);
    const panel = document.createElement("section");
    panel.id = "constraint-view";
    panel.hidden = true;
    constraints.setAttribute("aria-controls", panel.id);
    main.after(panel);
    const related = document.createElement("button");
    related.id = "open-related-constraints";
    related.type = "button";
    $("module-content").append(related);
    let active = false;
    let canvas;
    const label = (zh, en) => isChinese2() ? zh : en;
    const sync = () => {
      nav.setAttribute("aria-label", label("\u9879\u76EE\u89C6\u56FE", "Project views"));
      architecture.textContent = label("\u67B6\u6784", "Architecture");
      constraints.textContent = label("\u7EA6\u675F", "Constraints");
      architecture.setAttribute("aria-pressed", String(!active));
      constraints.setAttribute("aria-pressed", String(active));
      const count = view.rules.filter((rule) => rule.modules.includes(selectedModuleId ?? "")).length;
      related.textContent = count ? label(`\u67E5\u770B\u5173\u8054\u7EA6\u675F\u56FE \xB7 ${count}`, `View related rules \xB7 ${count}`) : label("\u5C1A\u672A\u8BB0\u5F55\u6A21\u5757\u4E0E\u89C4\u5219\u7684\u5173\u8054", "No module-rule links recorded");
      related.disabled = !count;
    };
    const show = (value) => {
      active = value;
      main.hidden = value;
      panel.hidden = !value;
      if (value && !canvas) canvas = mountConstraintCanvas(panel, view.graph);
      const hash = new URLSearchParams(location.hash.slice(1));
      hash.set("view", value ? "constraints" : "architecture");
      try {
        history.replaceState(null, "", `#${hash}`);
      } catch {
      }
      sync();
      requestAnimationFrame(() => canvas?.resize());
      window.dispatchEvent(new Event("resize"));
    };
    architecture.onclick = () => show(false);
    constraints.onclick = () => show(true);
    related.onclick = () => {
      show(true);
      canvas?.filter(view.rules.filter((rule) => rule.modules.includes(selectedModuleId ?? "")).map((rule) => rule.id));
    };
    new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
    new MutationObserver(sync).observe($("module-constraints"), { childList: true, subtree: true });
    show(new URLSearchParams(location.hash.slice(1)).get("view") === "constraints");
  }
})();
</script>
</body>
</html>
