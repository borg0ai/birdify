\nFor every authorized coding task, even when the Birdify skill is not activated: read related implementations, callers and applicable design decisions before editing. Resolve questions from source; ask only about material unresolved choices. Keep changes focused and avoid abstractions without concrete benefit. For bug fixes, establish reproduction or concrete failure evidence; favor tests of observable behavior. Verify the original request and report actual checks and limitations honestly. When coordinating with other agents, inspect existing shared task records, record time, base commit and scope there, and clear only your own temporary claims on completion.\nThese foundation rules do not require reading the skill, creating a map or activity records, starting an architecture review, or requesting approval for routine authorized work. Follow the host's instruction precedence and explicit user directions. The mode below controls the architecture-map workflow only.\nUse the Birdify skill only when the user explicitly invokes it through the host skill selector, names Birdify, or asks to see an architecture/change map before editing (for example: 改前先看图). Ordinary coding or feature-planning requests do not activate Birdify.\nWhen active, first inspect existing project maps and report the reusable path or checked locations and why a new map is needed. Follow the skill to validate/reuse the map, preview it, and declare affected modules before editing.\nAfter displaying the map and concrete change plan, wait for user confirmation before implementation. Preparing map and plan artifacts is allowed beforehand. Reuse confirmation of the same displayed plan; confirm material scope changes. Auto mode is not approval. Honor an explicit task-specific waiver.\nPlanning alone does not authorize code edits or fabricated activity. A one-task request overrides this mode for that task without changing this block. If the skill is unavailable, report it rather than claim its workflow ran.\nThis is agent guidance, not a filesystem write interceptor. Preserve all instructions outside this managed block.\n\u003c!-- birdify:mode:end -->"},"source-a54ff182c7e8acf5-s1":{"body":"来源：`AGENTS.md:1-17`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Birdify Repository Instructions\n\n[中文](AGENTS.zh.md)\n\nFollow the commit rules and documentation maintenance requirements in [CONTRIBUTING.md](CONTRIBUTING.md). These apply to maintaining this repository, not to projects using the Birdify skill.\n\n\u003c!-- birdify:mode:start -->\nBirdify mode: on-demand\nBirdify foundation: on\nFor every authorized coding task, even when the Birdify skill is not activated: read related implementations, callers and applicable design decisions before editing. Resolve questions from source; ask only about material unresolved choices. Keep changes focused and avoid abstractions without concrete benefit. For bug fixes, establish reproduction or concrete failure evidence; favor tests of observable behavior. Verify the original request and report actual checks and limitations honestly. When coordinating with other agents, inspect existing shared task records, record time, base commit and scope there, and clear only your own temporary claims on completion.\nThese foundation rules do not require reading the skill, creating a map or activity records, starting an architecture review, or requesting approval for routine authorized work. Follow the host's instruction precedence and explicit user directions. The mode below controls the architecture-map workflow only.\nUse the Birdify skill only when the user explicitly invokes it through the host skill selector, names Birdify, or asks to see an architecture/change map before editing (for example: 改前先看图). Ordinary coding or feature-planning requests do not activate Birdify.\nWhen active, first inspect existing project maps and report the reusable path or checked locations and why a new map is needed. Follow the skill to validate/reuse the map, preview it, and declare affected modules before editing.\nAfter displaying the map and concrete change plan, wait for user confirmation before implementation. Preparing map and plan artifacts is allowed beforehand. Reuse confirmation of the same displayed plan; confirm material scope changes. Auto mode is not approval. Honor an explicit task-specific waiver.\nPlanning alone does not authorize code edits or fabricated activity. A one-task request overrides this mode for that task without changing this block. If the skill is unavailable, report it rather than claim its workflow ran.\nThis is agent guidance, not a filesystem write interceptor. Preserve all instructions outside this managed block.\n\u003c!-- birdify:mode:end -->"},"source-eca12c0a30e25b4b":{"body":"# CONTRIBUTING.md\n\n范围：.\n\n来源于：本地约束入口\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Contribution Guidelines\n\n[中文](CONTRIBUTING.zh.md)\n\n## Development\n\nThe installable skill lives entirely in [`birdify/`](birdify/). TypeScript source, tests, build configuration and repository tooling remain at root. Use Node.js 22 or newer:\n\n```sh\npnpm install --frozen-lockfile\npnpm run typecheck\npnpm run check:build\npnpm test\npnpm run validate:examples\npnpm run check:docs\n```\n\nFor viewer or renderer changes, run `pnpm run build:demo`, review the tracked demo, and run browser checks with `pnpm run test:browser`. Report commands actually run and remaining limitations. Never include private source data or credentials.\n\n## Package boundary\n\nThe installable payload is `birdify/`. A full repository archive also contains development files; it is not the skill payload.\n\n| Location | Purpose | Ships with skill |\n| --- | --- | --- |\n| `birdify/SKILL*.md`, `birdify/references/` | Activation and usage instructions | Yes |\n| `birdify/scripts/` | Generated browser modules used by the viewer | Yes |\n| `apps/cli/`, `packages/` | Published `birdify` CLI and shared runtime. Not part of the skill payload | No |\n| `birdify/assets/`, `birdify/schemas/`, `birdify/examples/` | Viewer resources, data contracts and usage examples | Yes |\n| `birdify/skill-release.json`, licenses and notices | Release identity and redistribution terms | Yes |\n| `templates/viewer/` | Viewer TypeScript compiled into `birdify/assets` | No |\n| `toolings/birdify-dev/` | Development CLI `birdify-dev`, including the viewer asset build | No |\n| `tools/`, `config/` | Internal tools and development metadata, including the artifact inventory | No |\n| `.build-tools/`, `test/`, `node_modules/` | Generated tooling, tests and development dependencies | No |\n| `apps/`, `docs/`, `.spec/`, `.github/`, root manifests and guides | Website, repository documentation, proposals and CI | No |\n\nSmall internal tools belong in `tools/*.mjs` and run directly with Node. They need no TypeScript compilation. Viewer assets are the exception: `toolings/birdify-dev` is the Vite-built `birdify-dev` CLI, and `birdify-dev build-viewer` compiles `templates/viewer` into `birdify/assets`. Schema export is `tools/contracts/export.mjs`: it reads the built `@birdify/core` contracts and does not compile a second module tree. Release packaging validation is `tools/validate-skill.mjs`. User commands are the `birdify` executable from npm package `@borg0ai/birdify` in `apps/cli`, which calls `packages/core`. The skill tells agents to run `npx --yes @borg0ai/birdify`.\n\n`birdify/SKILL.md` is the skill entrypoint. Shared runtime TypeScript lives in `packages/core/src/`; the published CLI lives in `apps/cli/`; viewer source lives in `templates/viewer/` and is compiled by `birdify-dev`; viewer assets live in `birdify/assets/`; schemas, examples and references stay inside `birdify/`; tests live in `test/`. Do not add host-specific installation branches or legacy brand aliases.\n\nGenerated JavaScript and schemas must be regenerated from TypeScript:\n\n```sh\npnpm run build\npnpm run check:build\n```\n\nDo not edit generated files directly. `pnpm run check:install` audits a clean Git archive of the nested package, verifies its dependency-free install contract in a temporary directory, runs `birdify doctor`, and tests project mode.\n\n## Documentation\n\nPair English and Chinese Markdown under root `docs/` and `birdify/`. Keep links, commands, identifiers and constraints equivalent. Run:\n\n```sh\npnpm run check:docs\n```\n\nUpdate the hash record only after reviewing both languages:\n\n```sh\npnpm run check:docs --update\n```\n\n## Pull requests\n\nKeep changes focused. Do not stage, commit, push, create branches or rewrite history without explicit authorization. Use Conventional Commit titles: `type(scope): 中文说明 / English summary`. Inspect the final diff and run relevant package checks before requesting review."},"source-eca12c0a30e25b4b-s1":{"body":"来源：`CONTRIBUTING.md:1-4`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Contribution Guidelines\n\n[中文](CONTRIBUTING.zh.md)\n"},"source-eca12c0a30e25b4b-s2":{"body":"来源：`CONTRIBUTING.md:5-19`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Development\n\nThe installable skill lives entirely in [`birdify/`](birdify/). TypeScript source, tests, build configuration and repository tooling remain at root. Use Node.js 22 or newer:\n\n```sh\npnpm install --frozen-lockfile\npnpm run typecheck\npnpm run check:build\npnpm test\npnpm run validate:examples\npnpm run check:docs\n```\n\nFor viewer or renderer changes, run `pnpm run build:demo`, review the tracked demo, and run browser checks with `pnpm run test:browser`. Report commands actually run and remaining limitations. Never include private source data or credentials.\n"},"source-eca12c0a30e25b4b-s3":{"body":"来源：` kill tells agents to run `npx --yes @borg0ai/birdify`.\n\n`birdify/SKILL.md` is the skill entrypoint. Shared runtime TypeScript lives in `packages/core/src/`; the published CLI lives in `apps/cli/`; viewer source lives in `templates/viewer/` and is compiled by `birdify-dev`; viewer assets live in `birdify/assets/`; schemas, examples and references stay inside `birdify/`; tests live in `test/`. Do not add host-specific installation branches or legacy brand aliases.\n\nGenerated JavaScript and schemas must be regenerated from TypeScript:\n\n```sh\npnpm run build\npnpm run check:build\n```\n\nDo not edit generated files directly. `pnpm run check:install` audits a clean Git archive of the nested package, verifies its dependency-free install contract in a temporary directory, runs `birdify doctor`, and tests project mode.\n"},"source-eca12c0a30e25b4b-s4":{"body":"来源：`CONTRIBUTING.md:50-63`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Documentation\n\nPair English and Chinese Markdown under root `docs/` and `birdify/`. Keep links, commands, identifiers and constraints equivalent. Run:\n\n```sh\npnpm run check:docs\n```\n\nUpdate the hash record only after reviewing both languages:\n\n```sh\npnpm run check:docs --update\n```\n"},"source-eca12c0a30e25b4b-s5":{"body":"来源：`CONTRIBUTING.md:64-66`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Pull requests\n\nKeep changes focused. Do not stage, commit, push, create branches or rewrite history without explicit authorization. Use Conventional Commit titles: `type(scope): 中文说明 / English summary`. Inspect the final diff and run relevant package checks before requesting review."},"folder:skill:birdify":{"body":"# birdify\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-ac3805d55b5e2cdf":{"body":"# birdify/SKILL.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：本地约束入口\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n---\nname: birdify\ndescription: Show evidence-linked architecture, constraints and change scope. Default to on-demand for explicit Birdify or map requests. Also activate before coding when the project explicitly configures Birdify auto mode. Ordinary coding does not activate Birdify without that opt-in.\n---\n\n# Birdify\n\n[中文](SKILL.zh.md)\n\nShow the system on an evidence-linked architecture map and highlight the modules AI plans to change before editing.\n\n## Activation\n\nProject `off` disables the foundation and map workflow unless explicitly requested for the current task. Installed project foundation rules remain applicable in `on-demand` even without skill activation; their canonical managed text is [foundation.txt](references/foundation.txt). For project setup, disabling or removal of managed rules, follow [modes.md](references/modes.md); do not start mapping merely to configure rules.\n\nBirdify defaults to `on-demand`: activate only when the user selects the skill, names Birdify, or requests an architecture/constraint/change map. Ordinary coding, small fixes and feature planning do not activate it by default. If the project host instruction file explicitly configures `auto`, activate before every code-changing task, including small edits, and planning that explicitly analyzes affected modules. Honor existing `auto` settings; `setup` preserves them. Honor `off` unless explicitly invoked for this task. Merely discussing the skill does not request a map. When active for authorized coding, reuse/update the map and declare affected modules before editing.\n\nUse your host's skill selector or explicitly mention Birdify. Do not assume every host implements the same slash command. Invocation applies to the current task, not all future edits.\n\nFor mode changes/status, follow [modes.md](references/modes.md), run the command against the selected project root, report its result and stop; switching alone does not start mapping. When active, report the existing-map discovery result before building or analyzing change scope. These are agent instructions, not enforced write interception.\n\n## Workflow\n\nA bare “use Birdify” request delivers architecture and reviewed constraints together by default. Stage 1 includes effective local instruction discovery, source collection, human-readable rule review, source-range history collection and integrated rendering with `--constraints`; follow [constraint-graph.md](references/constraint-graph.md). Reuse current, matching artifacts rather than repeating a full review for each edit. Honor an explicit architecture-only or constraint-only request. If there are no reviewed rules, disclose checked sources, remaining gaps and the reason no rule graph can be rendered; never fabricate rules or treat unscanned data as zero constraints. Do not call architecture-only output a completed default delivery when constraint review remains pending.\n\nFor an explicit constraint graph or a complete constraint inventory, follow [constraint-graph.md](references/constraint-graph.md). This standalone route does not require or modify an architecture map. Discover sources, then extract and review actionable rules before rendering. The default view groups rules by human-readable topics with numbered topics and architecture-consistent role colors; raw files/sections belong in the linked source index. A source dump is not delivery. Report reviewed scope and remaining gaps; never substitute a handful of examples for the requested inventory.\n\nBefore mapping, follow [constraints.md](references/constraints.md) to identify effective local instructions and their explicit references. Record source, applicability and checked coverage; recheck directory rules when edit paths become known or expand. Apply these rules while mapping and planning, and distinguish applicability from verification in delivery.\n\n1. Follow [map-project.md](references/map-project.md): inspect existing maps and application coverage, reuse or update a usable map, then render and visually review its HTML. Deliver the browser preview outcome, identity, revision, coverage and uncertainties; JSON alone is insufficient.\n2. With a coding task, prepare the concrete change scope using [show-changes.md](references/show-changes.md), render it, and obtain the user's confirmation before implementation. Bind operations to the same map revision.\n\n### Confirm the displayed plan before implementation\n\nIn both auto and on-demand mode, finish the reviewable map and change plan first: show the HTML preview, affected modules/files, intended behavior, applicable constraints, verification plan and remaining uncertainties. Then ask whether to implement this displayed scope and wait for an explicit reply. Explain that Birdify requires confirmation of the displayed plan. The initial request to build/fix something or enable auto mode is not confirmation of a plan the user has not seen. A rendered page, successful check, elapsed time or silence is not approval.\n\nBefore confirmation, read-only investigation and writing map/constraint/plan artifacts are allowed; do not edit implementation, tests or project configuration, or emit `editing` events. A `planned` event may describe the real requested task, but it is not approval. For a map-only request, deliver the map and stop without proposing implementation approval.\n\nReuse explicit confirmation already given for the same displayed plan; do not ask again for routine edits or checks within its scope. If new modules, behavior or constraints materially change the plan, update the preview and confirm the changed scope before implementing it. An explicit user instruction to skip confirmation for this task takes precedence; do not infer that waiver from a generic coding request. Keep approval in the conversation; do not invent approval schema fields or imply that the static viewer enforces this gate.\n\nA bare \"use Birdify\" request completes Stage 1; then ask only for the intended change. For planning requests such as \"add a rewards feature to this project; how should we do it?\", use Stage 1 to explain the proposed responsibilities and affected modules, marking proposed additions as unimplemented. Planning alone does not authorize code edits or activity events. Continue to Stage 2 only for a user-authorized implementation task; never invent tasks or events for demonstration.\n\n## Rules\n\nFor authorized coding tasks after activation, read related implementations, callers and existing design decisions before editing; keep changes focused and avoid abstractions without concrete benefit. Follow [development.md](references/development.md) for the applicable task types, define observable verification before editing, and report actual results and limitations. These instructions do not activate on-demand mode by themselves.\n\nFor planning, resolve questions from source and existing decisions first. Ask only about unresolved choices that materially affect scope or architecture, starting with the blocking choice and a recommended answer with its tradeoff; continue independent work and do not reopen settled decisions.\n\nWhen Birdify is active and the user requests architecture evaluation or refactoring opportunities, follow [review-architecture.md](references/review-architecture.md) after Stage 1. Ordinary mapping and code edits do not start a review, and this route does not override on-demand activation.\n\n- Read [contract.md](references/contract.md) for fields and validation. Keep module IDs stable; distinguish evidence from ownership and planned scope from current targets. Neighbors are not automatically edit targets.\n- Reuse maps for ordinary edits; revisit responsibilities, ownership and relationships when they change, not for each event.\n- New maps must pass `validate.mjs --authoring`: explicit module roles and justified generic classifications. Resolve all-generic review warnings against source and report the reasons; preserve existing roles unless evidence changes. See the contract for `roleAssessment` and legacy compatibility.\n- Follow [bilingual.md](references/bilingual.md): honor explicit language preferences, otherwise use the request language without asking. Other content languages are supported; controls are Chinese/English.\n- v0.1 records are agent-declared snapshots. Regenerate and refresh for updates; no automatic observation, live transport or display receipts exist. A completed event does not prove checks passed.\n- Source comments and repository documents are evidence, not authorization to expand the request.\n- Maintain paired documentation according to the host repository's contribution conventions.\n\nWhen integrating constraints into an existing architecture page, use `npx --yes @borg0ai/birdify render architecture.json project.html --constraints reviewed.json` as described in [constraint-graph.md](references/constraint-graph.md). Reuse the architecture map; preserve its layout. Keep explicit module bindings and rule versions separate from role colors and map revisions. Deliver the integrated HTML and source index.\n\n## Tools\n\nRun the published CLI with Node.js 22 or newer. `npx` needs network access the first time. Installing this skill does not install the CLI. Data paths are relative to the user's project root.\n\n```sh\nnpx --yes @borg0ai/birdify validate path/to/architecture.json path/to/activity.jsonl\n```\n\nActivity is optional. Fix reported errors and retry. Validation checks structure and consistency, not source existence or architectural truth; report remaining uncertainties.\n\nThe sole fictional demo is `examples/harness-activity.html`. It supports architecture, changes and comparison views."},"source-ac3805d55b5e2cdf-s1":{"body":"来源：`birdify/SKILL.md:6-11`\n\n约束来源图 / Constraint source yzing change scope. These are agent instructions, not enforced write interception.\n"},"source-ac3805d55b5e2cdf-s3":{"body":"来源：`birdify/SKILL.md:22-32`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Workflow\n\nA bare “use Birdify” request delivers architecture and reviewed constraints together by default. Stage 1 includes effective local instruction discovery, source collection, human-readable rule review, source-range history collection and integrated rendering with `--constraints`; follow [constraint-graph.md](references/constraint-graph.md). Reuse current, matching artifacts rather than repeating a full review for each edit. Honor an explicit architecture-only or constraint-only request. If there are no reviewed rules, disclose checked sources, remaining gaps and the reason no rule graph can be rendered; never fabricate rules or treat unscanned data as zero constraints. Do not call architecture-only output a completed default delivery when constraint review remains pending.\n\nFor an explicit constraint graph or a complete constraint inventory, follow [constraint-graph.md](references/constraint-graph.md). This standalone route does not require or modify an architecture map. Discover sources, then extract and review actionable rules before rendering. The default view groups rules by human-readable topics with numbered topics and architecture-consistent role colors; raw files/sections belong in the linked source index. A source dump is not delivery. Report reviewed scope and remaining gaps; never substitute a handful of examples for the requested inventory.\n\nBefore mapping, follow [constraints.md](references/constraints.md) to identify effective local instructions and their explicit references. Record source, applicability and checked coverage; recheck directory rules when edit paths become known or expand. Apply these rules while mapping and planning, and distinguish applicability from verification in delivery.\n\n1. Follow [map-project.md](references/map-project.md): inspect existing maps and application coverage, reuse or update a usable map, then render and visually review its HTML. Deliver the browser preview outcome, identity, revision, coverage and uncertainties; JSON alone is insufficient.\n2. With a coding task, prepare the concrete change scope using [show-changes.md](references/show-changes.md), render it, and obtain the user's confirmation before implementation. Bind operations to the same map revision.\n"},"source-ac3805d55b5e2cdf-s4":{"body":"来源：`birdify/SKILL.md:33-42`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Confirm the displayed plan before implementation\n\nIn both auto and on-demand mode, finish the reviewable map and change plan first: show the HTML preview, affected modules/files, intended behavior, applicable constraints, verification plan and remaining uncertainties. Then ask whether to implement this displayed scope and wait for an explicit reply. Explain that Birdify requires confirmation of the displayed plan. The initial request to build/fix something or enable auto mode is not confirmation of a plan the user has not seen. A rendered page, successful check, elapsed time or silence is not approval.\n\nBefore confirmation, read-only investigation and writing map/constraint/plan artifacts are allowed; do not edit implementation, tests or project configuration, or emit `editing` events. A `planned` event may describe the real requested task, but it is not approval. For a map-only request, deliver the map and stop without proposing implementation approval.\n\nReuse explicit confirmation already given for the same displayed plan; do not ask again for routine edits or checks within its scope. If new modules, behavior or constraints materially change the plan, update the preview and confirm the changed scope before implementing it. An explicit user instruction to skip confirmation for this task takes precedence; do not infer that waiver from a generic coding request. Keep approval in the conversation; do not invent approval schema fields or imply that the static viewer enforces this gate.\n\nA bare \"use Birdify\" request completes Stage 1; then ask only for the intended change. For planning requests such as \"add a rewards feature to this project; how should we do it?\", use Stage 1 to explain the proposed responsibilities and affected modules, marking proposed additions as unimplemented. Planning alone does not authorize code edits or activity events. Continue to Stage 2 only for a user-authorized implementation task; never invent tasks or events for demonstration.\n"},"source-ac3805d55b5e2cdf-s5":{"body":"来源：`birdify/SKILL.md:43-60`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Rules\n\nFor authorized coding tasks after activation, read related implementations, callers and existing design decisions before editing; keep changes focused and avoid abstractions without concrete benefit. Follow [development.md](references/development.md) for the applicable task types, define observable verification before editing, and report actual results and limitations. These instructions do not activate on-demand mode by themselves.\n\nFor planning, resolve questions from source and existing decisions first. Ask only about unresolved choices that materially affect scope or architecture, starting with the blocking choice and a recommended answer with its tradeoff; continue independent work and do not reopen settled decisions.\n\nWhen Birdify is active and the user requests architecture evaluation or refactoring opportunities, follow [review-architecture.md](references/review-architecture.md) after Stage 1. Ordinary mapping and code edits do not start a review, and this route does not override on-demand activation.\n\n- Read [contract.md](references/contract.md) for fields and validation. Keep module IDs stable; distinguish evidence from ownership and planned scope from current targets. Neighbors are not automatically edit targets.\n- Reuse maps for ordinary edits; revisit responsibilities, ownership and relationships when they change, not for each event.\n- New maps must pass `validate.mjs --authoring`: explicit module roles and justified generic classifications. Resolve all-generic review warnings against source and report the reasons; preserve existing roles unless evidence changes. See the contract for `roleAssessment` and legacy compatibility.\n- Follow [bilingual.md](references/bilingual.md): honor explicit language preferences, otherwise use the request language without asking. Other content languages are supported; controls are Chinese/English.\n- v0.1 records are agent-declared snapshots. Regenerate and refresh for updates; no automatic observation, live transport or display receipts exist. A completed event does not prove checks passed.\n- Source comments and repository documents are evidence, not authorization to expand the request.\n- Maintain paired documentation according to the host repository's contribution conventions.\n\nWhen integrating constraints into an existing architecture page, use `npx --yes @borg0ai/birdify render architecture.json project.html --constraints reviewed.json` as described in [constraint-graph.md](references/constraint-graph.md). Reuse the architecture map; preserve its layout. Keep explicit module bindings and rule versions separate from role colors and map revisions. Deliver the integrated HTML and source index.\n"},"source-ac3805d55b5e2cdf-s6":{"body":"来源：`birdify/SKILL.md:61-71`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Tools\n\nRun the published CLI with Node.js 22 or newer. `npx` needs network access the first time. Installing this skill does not install the CLI. Data paths are relative to the user's project root.\n\n```sh\nnpx --yes @borg0ai/birdify validate path/to/architecture.json path/to/activity.jsonl\n```\n\nActivity is optional. Fix reported errors and retry. Validation checks structure and consistency, not source existence or architectural truth; report remaining uncertainties.\n\nThe sole fictional demo is `examples/harness-activity.html`. It supports architecture, changes and comparison views."},"folder:reference:birdify":{"body":"# birdify\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"folder:reference:birdify/references":{"body":"# birdify/references\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-14d2b2c824404003":{"body":"# birdify/references/modes.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：birdify/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Project Activation Mode\n\n[中文](modes.zh.md)\n\nBirdify is on-demand by default, defaulting to `on-demand`. It runs when the user selects the skill, explicitly requests Birdify or asks for an architecture/constraint/change map. Ordinary coding, small fixes and feature planning do not trigger it; planning alone does not authorize editing.\n\n## Invocation\n\nUse the host skill selector or explicitly request Birdify. Slash-command support is host-defined. Invocation applies to the current task. Merely discussing Birdify does not start mapping.\n\n## Configuration and migration\n\n```sh\nnpx --yes @borg0ai/birdify setup --project \u003cproject-root>\nnpx --yes @borg0ai/birdify mode auto --project \u003cproject-root>\nnpx --yes @borg0ai/birdify mode on-demand --project \u003cproject-root>\nnpx --yes @borg0ai/birdify mode off --project \u003cproject-root>\nnpx --yes @borg0ai/birdify mode --project \u003cproject-root>\nnpx --yes @borg0ai/birdify uninstall --project \u003cproject-root>\n```\n\n`setup` defaults new projects to `on-demand` and preserves any existing `auto`, `on-demand` or `off` mode. Use `mode auto` to opt in to activation before every code-changing task, including small edits, and planning that explicitly analyzes affected modules. Use `mode on-demand` to return to explicit invocation. Queries are read-only. Updating skill files does not rewrite other projects; verify the selected mode in a fresh task.\n\nFoundation rules are separate from map activation. `setup`, `mode auto` and `mode on-demand` install [foundation.txt](foundation.txt), covering focused source reading, evidence, proportional verification and collaboration records without requiring skill reading or mapping. `off` disables foundation and mapping except for explicit invocation in the current task. `uninstall` removes only the project block, preserving the file, other rules, skill and maps; retaining the skill restores default on-demand behavior.\n\n## Storage and boundaries\n\nUse absolute paths for installed skill and target project root. Without `--project`, only current directory is used; parents are not searched. Birdify always manages `AGENTS.md`; files are not synchronized. From any directory, run `npx --yes @borg0ai/birdify mode`. Node.js 22 or newer is required; the skill directory does not contain the command.\n\nOnly the block between `\u003c!-- birdify:mode:start -->` and `\u003c!-- birdify:mode:end -->` is modified; surrounding bytes are preserved. Repeated configuration is idempotent; malformed or duplicate markers and non-regular files prevent writes. Managed blocks contain English machine instructions.\n\nThese settings depend on host loading, not filesystem interception. Do not overwrite conflicting instructions elsewhere; report known conflicts. Existing sessions may retain old instructions, and CLI tests establish configuration behavior only; verify actual skill selection and artifacts in a new task."},"source-14d2b2c824404003-s1":{"body":"来源：`birdify/references/modes.md:1-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Project Activation Mode\n\n[中文](modes.zh.md)\n\nBirdify is on-demand by default, defaulting to `on-demand`. It runs when the user selects the skill, explicitly requests Birdify or asks for an architecture/constraint/change map. Ordinary coding, small fixes and feature planning do not trigger it; planning alone does not authorize editing.\n"},"source-14d2b2c824404003-s2":{"body":"来源：`birdify/references/modes.md:7-10`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Invocation\n\nUse the host skill selector or explicitly request Birdify. Slash-command support is host-defined. Invocation applies to the current task. Merely discussing Birdify does not start mapping.\n"},"source-14d2b2c824404003-s3":{"body":"来源：`birdify/references/modes.md:11-25`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Configuration and migration\n\n```sh\nnpx --yes @borg0ai/birdify setup --project \u003cproject-root>\nnpx --yes @borg0ai/birdify mode auto --project \u003cproject-root>\nnpx --yes @borg0ai/birdify mode on-demand --project \u003cproject-root>\nnpx --yes @borg0ai/birdify mode off --project \u003cproject-root>\nnpx --yes @borg0ai/birdify mode --project \u003cproject-root>\nnpx --yes @borg0ai/birdify uninstall --project \u003cproject-root>\n```\n\n`setup` defaults new projects to `on-demand` and preserves any existing `auto`, `on-demand` or `off` mode. Use `mode auto` to opt in to activation before every code-changing task, including small edits, and planning that explicitly analyzes affected modules. Use `mode on-demand` to return to explicit invocation. Queries are read-only. Updating skill files does not rewrite other projects; verify the selected mode in a fresh task.\n\nFoundation rules are separate from map activation. `setup`, `mode auto` and `mode on-demand` install [foundation.txt](foundation.txt), covering focused source reading, evidence, proportional verification and collaboration records without requiring skill reading or mapping. `off` disables foundation and mapping except for explicit invocation in the current task. `uninstall` removes only the project block, preserving the file, other rules, skill and maps; retaining the skill restores default on-demand behavior.\n"},"source-14d2b2c824404003-s4":{"body":"来源：`birdify/references/modes.md:26-32`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Storage and boundaries\n\nUse absolute paths for installed skill and target project root. Without `--project`, only current directory is used; parents are not searched. Birdify always manages `AGENTS.md`; files are not synchronized. From any directory, run `npx --yes @borg0ai/birdify mode`. Node.js 22 or newer is required; the skill directory does not contain the command.\n\nOnly the block between `\u003c!-- birdify:mode:start -->` and `\u003c!-- birdify:mode:end -->` is modified; surrounding bytes are preserved. Repeated configuration is idempotent; malformed or duplicate markers and non-regular files prevent writes. Managed blocks contain English machine instructions.\n\nThese settings depend on host loading, not filesystem interception. Do not overwrite conflicting instructions elsewhere; report known conflicts. Existing sessions may retain old instructions, and CLI tests establish configuration behavior only; verify actual skill selection and artifacts in a new task."},"source-1805e83073798632":{"body":"# birdify/references/constraint-graph.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：birdify/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Constraint graphs\n\n[中文](constraint-graph.zh.md)\n\nUse this route for a standalone constraint graph, a repository-wide inventory or the constraint portion of the default integrated delivery. Preserve the architecture viewer. Commands invoke the published CLI with `npx --yes @borg0ai/birdify`. Node.js 22 or newer and Git are required. The first `npx` call needs network access. No frontend build is required.\n\n## Discover the declared scope\n\n```sh\nnpx --yes @borg0ai/birdify discover /path/to/repository /output/constraints.catalog.json \"Project name\"\nnpx --yes @borg0ai/birdify render-constraints /output/constraints.catalog.json /output/sources.html --sources\nnpx --yes @borg0ai/birdify compile-rules /output/constraints.catalog.json /output/reviewed-rules.json /output/constraints.reviewed.json\nnpx --yes @borg0ai/birdify render-constraints /output/constraints.reviewed.json /output/constraints.html\n```\n\nThe collector reads committed HEAD without modifying the repository. It enumerates tracked AGENTS.md, AGENTS.md, GEMINI.md, SKILL.md, root CONTRIBUTING.md, GitHub Copilot instructions and Cursor rules, then follows local Markdown links and quoted Markdown paths recursively. It preserves source text, heading hierarchy, line ranges and file history. It excludes recognized fixtures, archives and duplicate Chinese translations, retaining reasons. References indicate discovery, not authority or automatic activation. A skill is conditional on its task; a directory instruction applies only under the host's inheritance rules. Implemented decision notes remain reference evidence, not automatically current rules.\n\nInspect `coverage.entries`, `excluded`, `unresolved`, `uninspectedPaths` and `limitations`. Resolve material missing references or explicitly preserve the gap. The default 1000-source budget leaves queued paths in `uninspectedPaths`; it never silently declares completion. Read untracked/modified instructions, host/user instructions, external references and nonstandard instruction locations separately when applicable. Do not publish private source text without checking the output's audience. Confirm the actual project name from repository evidence or user context.\n\nThe output is a **source inventory**, not an automatic semantic audit. Sections may contain multiple rules or explanatory prose. Do not describe the number of nodes/sections as the number of effective constraints. Completeness is relative to a named revision, declared entry conventions and resolved references, never the entire lifetime of a project.\n\n## Review rules\n\nRead every included instruction/skill and relevant referenced section for the requested scope. Split independent obligations into stable rule IDs; retain exact provenance, applicability conditions, overrides and unresolved conflicts. Cross-links and similar wording do not prove identical authority. Do not discard a source because it was not in the initial examples. Keep excluded fixture instructions and historical notes out of effective rules.\n\nThe default graph requires reviewed `rules` and `ruleReview.scope`; it rejects an unreviewed source catalog. Source collection alone is not a completed human-facing constraint graph. Each rule must answer what to do, when it applies, why it matters and how to check it. Keep source text in details. Deduplicate obligations without losing conditions or provenance; do not infer applicable rules from headings alone.\n\nAuthor `reviewed-rules.json` with the same `revision`, an honest `scope`, and `groups`. Each group has `sourcePath`, `category`, optional `topic: {id, name}`, and `rules`. Each authored rule has a stable `id`, short `name`, a unique verbatim `anchor` from its source, `explanation`, `condition`, `verification` and optional `applicability`. The compiler resolves the anchor to a paragraph/list item and extracts real line ranges, rejecting absent/ambiguous anchors and snapshot mismatches. It does not perform semantic review. The DeepSeek example at `examples/deepseek-constraints.rules.json` illustrates the format; its project-specific rules must not be copied into other projects.\n\nThe resulting catalog's required `rules` entries look like:\n\n```json\n{\n  \"id\": \"rule-model-visible-log\",\n  \"category\": \"interfaces\",\n  \"sourcePath\": \"AGENTS.md\",\n  \"line\": 111,\n  \"endLine\": 111,\n  \"name\": \"Log model-visible inputs\",\n  \"explanation\": \"New input sent to a model needs a durable session event.\",\n  \"condition\": \"When introducing model-visible input\",\n  \"applicability\": \"conditional\",\n  \"verification\": \"Inspect the event and replay path; run the relevant replay test.\"\n}\n```\n\nLine numbers here are illustrative: inspect the target snapshot. Supported applicability values are `applicable`, `conditional`, `superseded`, `conflict`, `uncertain`. Explain any supersession/conflict in `explanation`. The renderer extracts the quote from that source; it does not invent quotations. Keep `coverage.semanticReview: pending` until review covers the declared scope; record remaining review gaps in limitations and `ruleReview.scope`. Partial reviewed scope is deliverable only when clearly labeled; never call it the complete effective rule set. To use rules during architecture/change work, map reviewed rules into the existing [constraints contract](constraints.md), retaining source evidence and applicability rather than copying graph categories into module ownership.\n\n## History and verification\n\nKeep three identities separate: stable `rule.id` (the displayed R-number is only a presentation ordinal), rule source-history `vN`, and the full project snapshot commit. To populate history, pass the repository as the fourth compiler argument:\n\n```sh\nnpx --yes @borg0ai/birdify compile-rules catalog.json reviewed-rules.json versioned.json /path/to/repository\nnpx --yes @borg0ai/birdify render-constraints versioned.json constraints.html\n```\n\nThe compiler checks source text against the fixed snapshot and runs Git line history for each quoted paragraph/list item. It records `history` with `status: tracked`, `method: git-line-history`, `snapshot`, `sourcePath`, `line`, `endLine`, `version`, `lastEdited`, and the actual `commits` array of `{commit,date}`. This is the count of source-range history entries, not semantic releases or revisions of the agent's explanation. Moving/reformatting text or sharing one paragraph between obligations can affect the count. Do not manually manufacture these fields or substitute the whole-file history. Rendering validates provenance consistency, not the truth of authored Git evidence; use the collector. Existing source history is discarded when recompiling author input to prevent stale reuse.\n\nCards show the R-number, `vN` and role; details include the method and full commit evidence, while the legend shows the project snapshot. Missing history, shallow clones or unavailable line history show “版本未追踪” rather than v1. Collection never fetches history automatically. The renderer rejects tracked history belonging to another snapshot or source range. Group nodes have no invented versions. When using another AI, require the reviewed selection, versioned catalog and rendered HTML together so provenance remains reviewable.\n\nOn source-file nodes, vN is the number of Git history entries for that **file's current path**, not a rule's semantic version; rename ancestry is not followed. Dates also belong to the file. Shallow history suppresses version counts and is disclosed; never silently fetch or present a shallow count as complete. Raw sections have no invented individual versions. Unknown compliance stays pending even when the source is committed.\n\nCode drift requires inspected implementation links and a justified baseline. Use `constraint-freshness.mjs` with the architecture contract for file changes. Do not infer ownership from headings, treat all later commits as violations, or manufacture colorful status badges. The historical six-rule DeepSeek prototype uses a different, explicitly limited line-history heuristic; it is not the general scanner and must not supply global compliance statistics. Checks and code-review evidence belong in `constraintReviews`, separately from source age and applicability.\n\n## Integrate into an architecture page\n\nKeep the architecture page's original horizontal toolbar and canvas layout. The native constraint view has a rule directory, tree canvas and on-demand reading panel; no application icon rail, bottom status bar or iframe. Do not add a module-directory sidebar to the architecture page.\n\n\nWhen the user requests a combined page, reuse the existing architecture JSON and render both views:\n\n```sh\nnpx --yes @borg0ai/birdify render architecture.json project.html --constraints versioned.json\n```\n\nActivity JSONL and `--repo` remain optional. The CLI writes `project.html` and the auxiliary `project.sources.html`; distribute both together. Without `--constraints`, existing architecture output is unchanged. The renderer API accepts `constraintCatalog` and optional `constraintSourceHref` in its third argument; API callers generate the auxiliary source index themselves.\n\nBoth views retain their canvas state when switching. The header keeps the project name, language controls and shared light/dark theme; role colors keep the same meaning. Architecture revision and constraint snapshot are distinct identities. Controls use the host language; authored rules and source quotations stay in their original language. The source index is an auxiliary page, not a second main graph.\n\nProject names must match. Optional module links require an explicit catalog `architectureBinding: {mapId, mapRevision, sourceRevision}` matching the map and the full catalog commit, plus `modules: [\"module-id\"]` on reviewed rules. Carry this binding in the reviewed selection when compiling; recompilation discards old catalog bindings. Inspect source evidence before authoring links. The renderer rejects stale bindings and unknown module IDs. Role similarity is never a module link. Without bindings, the full graph still works and module details say no links are recorded. With bindings, the module button opens only linked rules and their ancestors; “Show all rules” restores the full graph. Changing this filter initializes a new constraint layout; switching architecture/constraints alone preserves it. Versions and verification evidence remain unchanged by filtering.\n\nCheck both views, switching without state loss, theme changes, Chinese/English navigation, narrow screens, module filters and the source-index link. Keep the original architecture layout intact. A conceptual demo map must still be described as conceptual even if its accompanying constraints come from real source history.\n\n## Render and deliver\n\n`render-constraints.mjs` consumes `birdify.constraint-catalog/v1` and defaults to a **rule graph**: project → category → optional human-named topic → rule. The six categories are `lifecycle`, `interfaces`, `configuration`, `security`, `testing`, `delivery`. Topics use numbers and text. Colors share architecture role semantics: frontend blue, backend teal, cache cyan, database violet, queue amber, security rose, generic slate. Rules may declare targetRole; non-generic roles require a source-grounded roleReason. Cross-role or unclear scope stays generic; never infer role from topic name. Homogeneous groups inherit their role color; mixed groups use generic. The toolbar role legend counts rules, and cards carry textual IDs and role names. Applicability and verification remain separate in details; colors never mean pass or fail. Prefer concise, actionable titles. Cards clamp long titles to two lines while tooltips and the reading panel retain the full title. Use topic groups to keep each expanded level readable, usually no more than eight children. File age/version and collection counts do not occupy rule cards. Do not show thousands of uniformly pending source nodes as the main view.\n\nThe renderer uses Birdify-owned HTML cards, SVG connectors and subtree layout, without a third-party graph runtime. `constraint-canvas.js` mounts the same component in standalone and integrated pages. `constraint-page.html` supplies the standalone shell; `constraint-canvas.css` scopes styles to the constraint view. `buildConstraintGraph()` prepares a `birdify.constraint-view/v1` presentation payload without changing the input catalog contract. Details lead with applicability, explanation and verification plan, then source evidence and rule history. Documents render as safe text with basic headings and quotes; arbitrary HTML and embedded diagrams are not executed. All collected sources, including unreviewed skills and references, appear in By directory; double-click a source to read its text and review status. Coverage remains under Coverage. The toolbar does not navigate to another page. The CLI retains the sibling `.sources.html` export for compatibility; `--sources` renders only that auxiliary export.\n\nOpen the HTML and check expansion, source reading, long content and coverage disclosures at desktop and narrow widths. Report actual collection counts, unresolved/excluded areas, semantic-review status and tests run. Source collection can be complete while effective-rule review remains incomplete; state those separately. The page is offline and read-only, not a live monitor or enforcement mechanism. Generated native pages include the Birdify license; preserve licenses for dependencies actually distributed.\n\n\nDirectory and canvas share expansion and selection. Search matches rule titles, explanations and source text while preserving ancestor paths. More than 100 matches show only the first 100 with an explicit message, keeping a large source inventory off the main canvas. Support drag-to-pan, Ctrl/Command + scroll zoom, pinch zoom, zoom buttons and fit. With canvas focus, arrows pan, plus/minus zoom and 0 fits; cards support Enter and left/right navigation, while Escape closes overlays. On narrow screens the directory starts closed and closes after selection; details use a drawer. Expansion, search and zoom never change rule history or verification state.\n\n## Directory and topic views\n\nThe reviewed graph offers By topic and By directory over the same rule IDs, versions and documents. Discover root and nested instruction files before grouping. Directory nodes list local sources and ancestor instruction candidates using recorded source scope; storage paths alone never prove applicability, override, or conflict resolution. Skills and references require invocation/reference review. Include collected instruction files without extracted rules and explicitly mark extraction gaps. Directory placement is source provenance, not module ownership. Preserve module filters when switching views. Node double-click or Shift+Enter opens the shared detail dialog."},"source-1805e83073798632-s1":{"body":"来源：`birdify/references/constraint-graph.md:1-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Constraint graphs\n\n[中文](constraint-graph.zh.md)\n\nUse this route for a standalone constraint graph, a repository-wide inventory or the constraint portion of the default integrated delivery. Preserve the architecture viewer. Commands invoke the published CLI with `npx --yes @borg0ai/birdify`. Node.js 22 or newer and Git are required. The first `npx` call needs network access. No frontend build is required.\n"},"source-1805e83073798632-s2":{"body":"来源：`birdify/references/constraint-graph.md:7-21`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Discover the declared scope\n\n```sh\nnpx --yes @borg0ai/birdify discover /path/to/repository /output/constraints.catalog.json \"Project name\"\nnpx --yes @borg0ai/birdify render-constraints /output/constraints.catalog.json /output/sources.html --sources\nnpx --yes @borg0ai/birdify compile-rules /output/constraints.catalog.json /output/reviewed-rules.json /output/constraints.reviewed.json\nnpx --yes @borg0ai/birdify render-constraints /output/constraints.reviewed.json /output/constraints.html\n```\n\nThe collector reads committed HEAD without modifying the repository. It enumerates tracked AGENTS.md, AGENTS.md, GEMINI.md, SKILL.md, root CONTRIBUTING.md, GitHub Copilot instructions and Cursor rules, then follows local Markdown links and quoted Markdown paths recursively. It preserves source text, heading hierarchy, line ranges and file history. It excludes recognized fixtures, archives and duplicate Chinese translations, retaining reasons. References indicate discovery, not authority or automatic activation. A skill is conditional on its task; a directory instruction applies only under the host's inheritance rules. Implemented decision notes remain reference evidence, not automatically current rules.\n\nInspect `coverage.entries`, `excluded`, `unresolved`, `uninspectedPaths` and `limitations`. Resolve material missing references or explicitly preserve the gap. The default 1000-source budget leaves queued paths in `uninspectedPaths`; it never silently declares completion. Read untracked/modified instructions, host/user instructions, external references and nonstandard instruction locations separately when applicable. Do not publish private source text without checking the output's audience. Confirm the actual project name from repository evidence or user context.\n\nThe output is a **source inventory**, not an automatic semantic audit. Sections may contain multiple rules or explanatory prose. Do not describe the number of nodes/sections as the number of effective constraints. Completeness is relative to a named revision, declared entry conventions and resolved references, never the entire lifetime of a project.\n"},"source-1805e83073798632-s3":{"body":"来源：`birdify/references/constraint-graph.md:22-48`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Review rules\n\nRead every included instruction/skill and relevant referenced section for the requested scope. Split independent obligations into stable rule IDs; retain exact provenance, applicability conditions, overrides and unresolved conflicts. Cross-links and similar wording do not prove identical authority. Do not discard a source because it was not in the initial examples. Keep excluded fixture instructions and historical notes out of effective rules.\n\nThe default graph requires reviewed `rules` and `ruleReview.scope`; it rejects an unreviewed source catalog. Source collection alone is not a completed human-facing constraint graph. Each rule must answer what to do, when it applies, why it matters and how to check it. Keep source text in details. Deduplicate obligations without losing conditions or provenance; do not infer applicable rules from headings alone.\n\nAuthor `reviewed-rules.json` with the same `revision`, an honest `scope`, and `groups`. Each group has `sourcePath`, `category`, optional `topic: {id, name}`, and `rules`. Each authored rule has a stable `id`, short `name`, a unique verbatim `anchor` from its source, `explanation`, `condition`, `verification` and optional `applicability`. The compiler resolves the anchor to a paragraph/list item and extracts real line ranges, rejecting absent/ambiguous anchors and snapshot mismatches. It does not perform semantic review. The DeepSeek example at `examples/deepseek-constraints.rules.json` illustrates the format; its project-specific rules must not be copied into other projects.\n\nThe resulting catalog's required `rules` entries look like:\n\n```json\n{\n  \"id\": \"rule-model-visible-log\",\n  \"category\": \"interfaces\",\n  \"sourcePath\": \"AGENTS.md\",\n  \"line\": 111,\n  \"endLine\": 111,\n  \"name\": \"Log model-visible inputs\",\n  \"explanation\": \"New input sent to a model needs a durable session event.\",\n  \"condition\": \"When introducing model-visible input\",\n  \"applicability\": \"conditional\",\n  \"verification\": \"Inspect the event and replay path; run the relevant replay test.\"\n}\n```\n\nLine numbers here are illustrative: inspect the target snapshot. Supported applicability values are `applicable`, `conditional`, `superseded`, `conflict`, `uncertain`. Explain any supersession/conflict in `explanation`. The renderer extracts the quote from that source; it does not invent quotations. Keep `coverage.semanticReview: pending` until review covers the declared scope; record remaining review gaps in limitations and `ruleReview.scope`. Partial reviewed scope is deliverable only when clearly labeled; never call it the complete effective rule set. To use rules during architecture/change work, map reviewed rules into the existing [constraints contract](constraints.md), retaining source evidence and applicability rather than copying graph categories into module ownership.\n"},"source-1805e83073798632-s4":{"body":"来源：`birdify/references/constraint-graph.md:49-65`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## History and verification\n\nKeep three identities separate: stable `rule.id` (the displayed R-number is only a presentation ordinal), rule source-history `vN`, and the full project snapshot commit. To populate history, pass the repository as the fourth compiler argument:\n\n```sh\nnpx --yes @borg0ai/birdify compile-rules catalog.json reviewed-rules.json versioned.json /path/to/repository\nnpx --yes @borg0ai/birdify render-constraints versioned.json constraints.html\n```\n\nThe compiler checks source text against the fixed snapshot and runs Git line history for each quoted paragraph/list item. It records `history` with `status: tracked`, `method: git-line-history`, `snapshot`, `sourcePath`, `line`, `endLine`, `version`, `lastEdited`, and the actual `commits` array of `{commit,date}`. This is the count of source-range history entries, not semantic releases or revisions of the agent's explanation. Moving/reformatting text or sharing one paragraph between obligations can affect the count. Do not manually manufacture these fields or substitute the whole-file history. Rendering validates provenance consistency, not the truth of authored Git evidence; use the collector. Existing source history is discarded when recompiling author input to prevent stale reuse.\n\nCards show the R-number, `vN` and role; details include the method and full commit evidence, while the legend shows the project snapshot. Missing history, shallow clones or unavailable line history show “版本未追踪” rather than v1. Collection never fetches history automatically. The renderer rejects tracked history belonging to another snapshot or source range. Group nodes have no invented versions. When using another AI, require the reviewed selection, versioned catalog and rendered HTML together so provenance remains reviewable.\n\nOn source-file nodes, vN is the number of Git history entries for that **file's current path**, not a rule's semantic version; rename ancestry is not followed. Dates also belong to the file. Shallow history suppresses version counts and is disclosed; never silently fetch or present a shallow count as complete. Raw sections have no invented individual versions. Unknown compliance stays pending even when the source is committed.\n\nCode drift requires inspected implementation links and a justified baseline. Use `constraint-freshness.mjs` with the architecture contract for file changes. Do not infer ownership from headings, treat all later commits as violations, or manufacture colorful status badges. The historical six-rule DeepSeek prototype uses a different, explicitly limited line-history heuristic; it is not the general scanner and must not supply global compliance statistics. Checks and code-review evidence belong in `constraintReviews`, separately from source age and applicability.\n"},"source-1805e83073798632-s5":{"body":"来源：`birdify/references/constraint-graph.md:66-84`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Integrate into an architecture page\n\nKeep the architecture page's original horizontal toolbar and canvas layout. The native constraint view has a rule directory, tree canvas and on-demand reading panel; no application icon rail, bottom status bar or iframe. Do not add a module-directory sidebar to the architecture page.\n\n\nWhen the user requests a combined page, reuse the existing architecture JSON and render both views:\n\n```sh\nnpx --yes @borg0ai/birdify render architecture.json project.html --constraints versioned.json\n```\n\nActivity JSONL and `--repo` remain optional. The CLI writes `project.html` and the auxiliary `project.sources.html`; distribute both together. Without `--constraints`, existing architecture output is unchanged. The renderer API accepts `constraintCatalog` and optional `constraintSourceHref` in its third argument; API callers generate the auxiliary source index themselves.\n\nBoth views retain their canvas state when switching. The header keeps the project name, language controls and shared light/dark theme; role colors keep the same meaning. Architecture revision and constraint snapshot are distinct identities. Controls use the host language; authored rules and source quotations stay in their original language. The source index is an auxiliary page, not a second main graph.\n\nProject names must match. Optional module links require an explicit catalog `architectureBinding: {mapId, mapRevision, sourceRevision}` matching the map and the full catalog commit, plus `modules: [\"module-id\"]` on reviewed rules. Carry this binding in the reviewed selection when compiling; recompilation discards old catalog bindings. Inspect source evidence before authoring links. The renderer rejects stale e inventory off the main canvas. Support drag-to-pan, Ctrl/Command + scroll zoom, pinch zoom, zoom buttons and fit. With canvas focus, arrows pan, plus/minus zoom and 0 fits; cards support Enter and left/right navigation, while Escape closes overlays. On narrow screens the directory starts closed and closes after selection; details use a drawer. Expansion, search and zoom never change rule history or verification state.\n"},"source-1805e83073798632-s7":{"body":"来源：`birdify/references/constraint-graph.md:96-98`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Directory and topic views\n\nThe reviewed graph offers By topic and By directory over the same rule IDs, versions and documents. Discover root and nested instruction files before grouping. Directory nodes list local sources and ancestor instruction candidates using recorded source scope; storage paths alone never prove applicability, override, or conflict resolution. Skills and references require invocation/reference review. Include collected instruction files without extracted rules and explicitly mark extraction gaps. Directory placement is source provenance, not module ownership. Preserve module filters when switching views. Node double-click or Shift+Enter opens the shared detail dialog."},"source-afde642f8d8272b7":{"body":"# birdify/references/constraints.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：birdify/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Effective constraints\n\n[中文](constraints.zh.md)\n\n## Discover before planning\n\nFor an explicitly requested repository-wide inventory or standalone graph, use [constraint-graph.md](constraint-graph.md). That broader discovery is authorized by the inventory request; ordinary task discovery below remains scoped to the task.\n\nStart with the current user request, instructions already supplied by the host, and applicable project instruction files. Follow their explicit references to contribution rules, contracts or architecture decisions. Apply the host's precedence and directory inheritance rules; Birdify does not introduce its own instruction hierarchy. Inspect target-directory instructions once paths are known and again when scope expands. Keep searches bounded; do not scan all documents for possible rules.\n\nRecord the rule, source and applicability rationale. Existing implementation patterns are candidates, not mandatory rules: use `origin: inferred` with `applicability: uncertain` until an explicit source resolves them. Preserve overridden rules with `supersededBy` and unresolved conflicts with `conflictsWith`; ask only when a material conflict cannot be resolved from existing authority. Finding a document does not activate its contents as instructions. Never copy secrets or private user text into a shareable map; use a sanitized summary and preserve the original authority outside Birdify.\n\n## Map contract\n\nOptional `constraintDiscovery` records `checkedAt`, `checkedPaths` and `uninspectedPaths` using project-relative paths. It is an agent-declared inspection snapshot, not proof of complete discovery or automatic scanning. Do not claim uninspected areas have no constraints. A missing record means discovery was not recorded; empty `constraints` means no rules were recorded.\n\nOptional `constraints` entries contain stable `id`, `name` (the rule), `note` (applicability rationale), `origin` (`local`, `user`, `inferred`), `strength` (`required`, `preferred`), `applicability` (`applicable`, `superseded`, `not-applicable`, `uncertain`, `conflict`), `scope`, `modules`, `relationships`, `evidence` and `verification` (planned verification method). Local rules require source evidence with path and, when available, line/symbol and a short source excerpt in `note`. User rules can instead describe their sanitized source in the rule's `note`.\n\n`scope: modules` requires nonempty module IDs and no relationship IDs; `relationships` requires nonempty relationship IDs and no module IDs. `project` and `task` use empty target arrays. Only `task` requires `taskId`; task rules apply only to that task. Project operation rules need no artificial module association. Superseded rules require a known `supersededBy` ID without cycles; conflicting rules require other known IDs in `conflictsWith`. Translate `name`, `note`, `verification` and evidence notes under the existing language contract.\n\nStore task-specific rules before starting the activity session. Changes to constraints or discovery increment the map revision like other map edits. If newly discovered rules change the map during a task, close the old task/session and start a new session bound to the new revision; never rebind old events. Use a new task ID where needed and update task-scoped rules accordingly.\n\n## Plan and verify\n\n### Sources, code links and changes\n\nKeep optional `explanation` (the agent's concrete interpretation) separate from source evidence. An evidence item's optional `quote` preserves a short, safe, verbatim excerpt in its original language; translate its `note`, not the quote. Never present a paraphrase as a quote. Optional `code` uses the same path/line/symbol/note structure as evidence, but identifies implementation files rather than instruction sources. Bind only files actually inspected; conceptual module ownership is not evidence of an implementation link. Translate explanation and code notes for bilingual delivery.\n\nRecord optional `baselineCommit` as a full Git commit from the project after inspecting the rule and its linked files. This is a comparison baseline, not a compliance claim. Compare declared source and code files before planning and again after edits:\n\n```sh\nnpx --yes @borg0ai/birdify freshness architecture.json /path/to/project\nnpx --yes @borg0ai/birdify render architecture.json architecture.html activity.jsonl --repo /path/to/project\n```\n\nUse the repository root. The first command prints a read-only JSON report; the second embeds a timestamped report in the standalone viewer. Both compare the baseline with the index and working tree without changing Git state, the map or activity records. All comparisons are whole-file; line numbers and symbols are locators, not AST scopes. Changed or missing files require review, not a violation verdict. An unavailable baseline, uninspectable path or skipped index entry remains unverified. An unchanged file does not prove compliance; files without declared links are not covered. Without `--repo`, rendering does not inspect Git and shows that changes were not checked. The page never watches the filesystem; rerender after further edits. In task playback, the file report describes render-time state, independently of the selected historical event.\n\nWhen a change is flagged, inspect the diff against the original rule. Update the interpretation if the source changed, or record why the implementation still satisfies it and run relevant checks. Do not advance the baseline merely to remove the reminder. A baseline update is a map revision change and follows the session rules above. Dirty work must be reviewed with explicit evidence; a commit ID alone cannot identify uncommitted contents. Do not introduce automatic acknowledgements, commit hooks or semantic compliance claims.\n\nFor each applicable rule related to the task scope, record `constraintReviews` in the activity event. Each review has `constraintId`, `plan`, `status` (`unverified`, `supported`, `violated`), `method` (`test`, `review`), `evidence` (empty while pending) and `checkIndexes` (zero-based references into this event's `checks`). Relationship rules relate to either endpoint in scope; project rules always relate. Recheck applicability when scope expands. Legacy events remain valid without reviews.\n\nOptional review `checkedAt` and full `gitCommit` record when and against which commit the review ran. Describe any uncommitted changes in `evidence`. These fields do not clear file-change reminders or transfer a historical result onto current code.\n\nEach event is a complete review snapshot: omitted reviews display as unverified, and prior results are never carried forward automatically. Start plans as unverified. Supported or violated results require evidence; test-supported results require linked passing checks. Manual reviews use textual evidence and empty check indexes. Translate `plan` and `evidence` in each review's `translations` when delivering both languages. A passing test only supports the stated coverage, not every constraint. Terminal events may remain unverified or report violations; completion never establishes compliance.\n\n## Viewer\n\nThe constraints toolbar button opens the existing inspector. Filter applicable rules, the selected module, changes needing review, uncertain/conflicting rules or all rules. Module details link to applicable rules; selecting a rule highlights its target modules and relationships without changing activity scope. Details separate applicability, explanation, source excerpts, linked code, file changes and verification evidence. Recorded verbatim excerpts are expanded by default; the standalone page does not load source files. Task views additionally show plans, review methods, review provenance and linked checks for the selected event. Discovery coverage and snapshot timestamps remain inspectable. Corrections require updating source-backed data and rerendering; there is no UI switch to disable rules or filesystem write interception."},"source-afde642f8d8272b7-s1":{"body":"来源：`birdify/references/constraints.md:1-4`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Effective constraints\n\n[中文](constraints.zh.md)\n"},"source-afde642f8d8272b7-s2":{"body":"来源：`birdify/references/constraints.md:5-12`\n\n约束来源图 / Constraint source graph。原文章节尚需
