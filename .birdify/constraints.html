ify**：仓库指令将 Birdify 模式配置为 auto 时\n\n编号表示主题，颜色表示适用角色；混合分组为通用色。所有实现结果仍未验证。"},"category-configuration":{"body":"# 配置与扩展\n\n- **保持中英双语文档同步**：修改或新增 docs/ 或 birdify/ 下的 Markdown 文档时\n\n编号表示主题，颜色表示适用角色；混合分组为通用色。所有实现结果仍未验证。"},"category-testing":{"body":"# 测试与验证\n\n- **禁止直接修改生成代码**：维护查看器前端脚本与契约模式时\n\n编号表示主题，颜色表示适用角色；混合分组为通用色。所有实现结果仍未验证。"},"category-delivery":{"body":"# 协作与交付\n\n- **改前展示地图并等待确认**：Birdify 地图工作流要求确认且用户未明确豁免本任务时\n- **遵循中英双语规范提交信息**：向仓库提交 Git Commit 时\n\n编号表示主题，颜色表示适用角色；混合分组为通用色。所有实现结果仍未验证。"},"topic-lifecycle-foundation":{"body":"# 开发基础原则\n\n- **改前查阅实现与调用方**：执行任何已授权的代码修改任务时"},"rule-read-before-edit":{"body":"# 改前查阅实现与调用方\n\n## 什么时候用\n\n执行任何已授权的代码修改任务时\n\n适用性：按条件适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\n在修改前必须阅读相关实现、调用方和适用的设计决策；保持变更聚焦，避免无具体价值的抽象。\n\n## 怎么检查\n\n检查任务执行步骤，核对相关源码调用方与设计决策的检索记录。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`AGENTS.md:10-17`\n\n> For every authorized coding task, even when the Birdify skill is not activated: read related implementations, callers and applicable design decisions before editing. Resolve questions from source; ask only about material unresolved choices. Keep changes focused and avoid abstractions without concrete benefit. For bug fixes, establish reproduction or concrete failure evidence; favor tests of observable behavior. Verify the original request and report actual checks and limitations honestly. When coordinating with other agents, inspect existing shared task records, record time, base commit and scope there, and clear only your own temporary claims on completion.\n> These foundation rules do not require reading the skill, creating a map or activity records, starting an architecture review, or requesting approval for routine authorized work. Follow the host's instruction precedence and explicit user directions. The mode below controls the architecture-map workflow only.\n> Use the Birdify skill before every code-changing task, including small edits, and for planning that explicitly analyzes affected modules. Enter the workflow once per task; update activity before each edit group, not each line.\n> When active, first inspect existing project maps and report the reusable path or checked locations and why a new map is needed. Follow the skill to validate/reuse the map, preview it, and declare affected modules before editing.\n> After displaying the map and concrete change plan, wait for user confirmation before implementation. Preparing map and plan artifacts is allowed beforehand. Reuse confirmation of the same displayed plan; confirm material scope changes. Auto mode is not approval. Honor an explicit task-specific waiver.\n> Planning alone does not authorize code edits or fabricated activity. A one-task request overrides this mode for that task without changing this block. If the skill is unavailable, report it rather than claim its workflow ran.\n> This is agent guidance, not a filesystem write interceptor. Preserve all instructions outside this managed block.\n> \u003c!-- birdify:mode:end -->\n\n来源文件最后修改：2026-09-26T14:13:53-07:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv2 · 2026-09-26T14:13:53-07:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：181743c77d6c53783d7f69da42580b8fb82e2db0\n\n- cbc1433c62315665cca04a0a342e226c1b80018e · 2026-09-26T14:13:53-07:00\n- 5b8778b3dafda95b726f4640229dcd4cdfc7272c · 2026-09-20T14:04:57-07:00"},"topic-interfaces-activation":{"body":"# 触发与调用界限\n\n- **Auto 模式在代码修改前激活 Birdify**：仓库指令将 Birdify 模式配置为 auto 时"},"rule-on-demand-trigger":{"body":"# Auto 模式在代码修改前激活 Birdify\n\n## 什么时候用\n\n仓库指令将 Birdify 模式配置为 auto 时\n\n适用性：按条件适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\nauto 模式要求每个代码修改任务及明确分析受影响模块的规划任务先运行 Birdify 工作流。\n\n## 怎么检查\n\n核对仓库模式配置，并确认相关代码任务在编辑前完成 Birdify 图谱与变更范围流程。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`AGENTS.md:8-17`\n\n> Birdify mode: auto\n> Birdify foundation: on\n> For every authorized coding task, even when the Birdify skill is not activated: read related implementations, callers and applicable design decisions before e -07:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv2 · 2026-09-26T14:13:53-07:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：181743c77d6c53783d7f69da42580b8fb82e2db0\n\n- cbc1433c62315665cca04a0a342e226c1b80018e · 2026-09-26T14:13:53-07:00\n- 5b8778b3dafda95b726f4640229dcd4cdfc7272c · 2026-09-20T14:04:57-07:00"},"topic-delivery-approval":{"body":"# 变更确认关卡\n\n- **改前展示地图并等待确认**：Birdify 地图工作流要求确认且用户未明确豁免本任务时"},"rule-confirm-before-implementation":{"body":"# 改前展示地图并等待确认\n\n## 什么时候用\n\nBirdify 地图工作流要求确认且用户未明确豁免本任务时\n\n适用性：按条件适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\n展示地图和具体计划后等待用户确认；明确的一次性任务指令可豁免本任务的确认要求。\n\n## 怎么检查\n\n检查对话记录，确认在用户给出明确许可前未触发代码写操作。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`AGENTS.md:14-17`\n\n> After displaying the map and concrete change plan, wait for user confirmation before implementation. Preparing map and plan artifacts is allowed beforehand. Reuse confirmation of the same displayed plan; confirm material scope changes. Auto mode is not approval. Honor an explicit task-specific waiver.\n> Planning alone does not authorize code edits or fabricated activity. A one-task request overrides this mode for that task without changing this block. If the skill is unavailable, report it rather than claim its workflow ran.\n> This is agent guidance, not a filesystem write interceptor. Preserve all instructions outside this managed block.\n> \u003c!-- birdify:mode:end -->\n\n来源文件最后修改：2026-09-26T14:13:53-07:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv1 · 2026-09-20T14:04:57-07:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：181743c77d6c53783d7f69da42580b8fb82e2db0\n\n- 5b8778b3dafda95b726f4640229dcd4cdfc7272c · 2026-09-20T14:04:57-07:00"},"topic-delivery-git-conventions":{"body":"# 版本控制与提交\n\n- **遵循中英双语规范提交信息**：向仓库提交 Git Commit 时"},"rule-bilingual-commit":{"body":"# 遵循中英双语规范提交信息\n\n## 什么时候用\n\n向仓库提交 Git Commit 时\n\n适用性：按条件适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\n使用约定式提交格式：`type(scope): 中文说明 / English summary`，提交前审查 diff 并执行对应检查。\n\n## 怎么检查\n\n检查提交日志，验证 Commit Title 格式是否满足中英双语规范。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`CONTRIBUTING.md:66-66`\n\n> Keep changes focused. Do not stage, commit, push, create branches or rewrite history without explicit authorization. Use Conventional Commit titles: `type(scope): 中文说明 / English summary`. Inspect the final diff and run relevant package checks before requesting review.\n\n来源文件最后修改：2026-09-26T13:04:52-07:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv2 · 2026-09-20T13:00:56-07:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：181743c77d6c53783d7f69da42580b8fb82e2db0\n\n- 9ecd7302963a317e225f5c7a8779f9e505906d06 · 2026-09-20T13:00:56-07:00\n- 634986284a8d140c58adb241710c1edf34660c57 · 2026-09-18T16:52:09+08:00"},"topic-configuration-documentation":{"body":"# 双语文档对齐\n\n- **保持中英双语文档同步**：修改或新增 docs/ 或 birdify/ 下的 Markdown 文档时"},"rule-pair-documentation":{"body":"# 保持中英双语文档同步\n\n## 什么时候用\n\n修改或新增 docs/ 或 birdify/ 下的 Markdown 文档时\n\n适用性：按条件适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\n中英文文档成对维护，链接、命令、标识符保持等价，修改后运行 check:docs 验证哈希记录。\n\n## 怎么检查\n\n运行 pnpm run check:docs，确保所有双语文档校验通过。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`CONTRIBUTING.md:52-52`\n\n> Pair English and Chinese Markdown under root `docs/` and `birdify/`. Keep links, commands, identifiers and constraints equivalent. Run:\n\n来源文件最后修改：2026-09-26T13:04:52-07:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv3 · 2026-09-20T13:00:56-07:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：181743c77d6c53783d7f69da42580b8fb82e2db0\n\n- 9ecd7302963a317e225f5c7a8779f9e505906d06 · 2026-09-20T13:00:56-07:00\n- 5d89eeaf7d584c0ab7daadb75eb9f902b1c55812 · 2026-09-10T19:22:08+08:00\n- 41e8b564b2cecdceb26ffa56479b09aba564259d · 2026-09-10T19:04:41+08:00"},"topic-testing-build-integrity":{"body":"# 构建与产物完整性\n\n- **禁止直接修改生成代码**：维护查看器前端脚本与契约模式时"},"rule-no-direct-edit-generated":{"body":"# 禁止直接修改生成代码\n\n## 什么时候用\n\n维护查看器前端脚本与契约模式时\n\n适用性：按条件适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\n生成的 JavaScript 与 JSON Schema 必须由 TypeScript 源码构建重新生成，严禁手工直接修改产物。\n\n## 怎么检查\n\n运行 pnpm run check:build，比对生成产物与 TypeScript 编译器输出一致性。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`CONTRIBUTING.md:48-48`\n\n> Do not edit generated files directly. `pnpm run check:install` audits a clean Git archive of the nested package, verifies its dependency-free install contract in a temporary directory, runs `birdify doctor`, and tests project mode.\n\n来源文件最后修改：2026-09-26T13:04:52-07:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv2 · 2026-09-20T13:00:56-07:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：181743c77d6c53783d7f69da42580b8fb82e2db0\n\n- 9ecd7302963a317e225f5c7a8779f9e505906d06 · 2026-09-20T13:00:56-07:00\n- 6115fe652da381ad6d85c907d87e1712da7e985b · 2026-09-11T10:32:32+08:00"},"directory-root":{"body":"# .\n\n## 本目录来源 / Local sources\n\n- AGENTS.md · 3 条已整理规则\n  改前查阅实现与调用方：执行任何已授权的代码修改任务时（conditional）\n  Auto 模式在代码修改前激活 Birdify：仓库指令将 Birdify 模式配置为 auto 时（conditional）\n  改前展示地图并等待确认：Birdify 地图工作流要求确认且用户未明确豁免本任务时（conditional）\n- CONTRIBUTING.md · 3 条已整理规则\n  遵循中英双语规范提交信息：向仓库提交 Git Commit 时（conditional）\n  保持中英双语文档同步：修改或新增 docs/ 或 birdify/ 下的 Markdown 文档时（conditional）\n  禁止直接修改生成代码：维护查看器前端脚本与契约模式时（conditional）\n\n## 上级指令来源 / Ancestor instructions\n\n无已采集来源 / No collected sources\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 6 条规则，来自 2 份来源。提炼当前仓库根目录 AGENTS.md 与 CONTRIBUTING.md 中的核心开发、触发、确认与贡献规则。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-0":{"body":"# AGENTS.md\n\n类型：instruction\n\n记录作用域：.\n\n来源审查状态：unreviewed\n\n- 改前查阅实现与调用方\n- Auto 模式在代码修改前激活 Birdify\n- 改前展示地图并等待确认\n\n## 原文 / Source\n\n> # Birdify Repository Instructions\n> \n> [中文](AGENTS.zh.md)\n> \n> Follow the commit rules and documentation maintenance requirements in [CONTRIBUTING.md](CONTRIBUTING.md). These apply to maintaining this repository, not to projects using the Birdify skill.\n> \n> \u003c!-- birdify:mode:start -->\n> Birdify mode: auto\n> Birdify foundation: on\n> For every authorized coding task, even when the Birdify skill is not activated: read related implementations, callers and applicable design decisions before editing. Resolve questions from source; ask only about material unresolved choices. Keep changes focused and avoid abstractions without concrete benefit. For bug fixes, establish reproduction or concrete failure evidence; favor tests of observable behavior. Verify the original request and report actual checks and limitations honestly. When coordinating with other agents, inspect existing shared task records, record time, base commit and scope there, and clear only your own temporary claims on completion.\n> These foundation rules do not require reading the skill, creating a map or activity records, starting an architecture review, or requesting approval for routine authorized work. Follow the host's instruction precedence and explicit user directions. The mode below controls the architecture-map workflow only.\n> Use the Birdify skill before every code-changing task, including small edits, and for planning that explicitly analyzes affected modules. Enter the workflow once per task; update activity before each edit group, not each line.\n> When active, first inspect existing project maps and report the reusable path or checked locations and why a new map is needed. Follow the skill to validate/reuse the map, preview it, and declare affected modules before editing.\n> After displaying the map and concrete change plan, wait for user confirmation before implementation. Preparing map and plan artifacts is allowed beforehand. Reuse confirmation of the same displayed plan; confirm material scope changes. Auto mode is not approval. Honor an explicit task-specific waiver.\n> Planning alone does not authorize code edits or fabricated activity. A one-task request overrides this mode for that task without changing this block. If the skill is unavailable, report it rather than claim its workflow ran.\n> This is agent guidance, not a filesystem write interceptor. Preserve all instructions outside this managed block.\n> \u003c!-- birdify:mode:end -->"},"directory-source-1":{"body":"# CONTRIBUTING.md\n\n类型：instruction\n\n记录作用域：.\n\n来源审查状态：unreviewed\n\n- 遵循中英双语规范提交信息\n- 保持中英双语文档同步\n- 禁止直接修改生成代码\n\n## 原文 / Source\n\n> # Contribution Guidelines\n> \n> [中文](CONTRIBUTING.zh.md)\n> \n> ## Development\n> \n> The installable skill lives entirely in [`birdify/`](birdify/). TypeScript source, tests, build configuration and repository tooling remain at root. Use Node.js 22 or newer:\n> \n> ```sh\n> pnpm install --frozen-lockfile\n> pnpm run typecheck\n> pnpm run check:build\n> pnpm test\n> pnpm run validate:examples\n> pnpm run check:docs\n> ```\n> \n> For viewer or renderer changes, run `pnpm run build:demo`, review the tracked demo, and run browser checks with `pnpm run test:browser`. Report commands actually run and remaining limitations. Never include private source data or credentials.\n> \n> ## Package boundary\n> \n> The installable payload is `birdify/`. A full repository archive also contains development files; it is not the skill payload.\n> \n> | Location | Purpose | Ships with skill |\n> | --- | --- | --- |\n> | `birdify/SKILL*.md`, `birdify/references/` | Activation and usage instructions | Yes |\n> | `birdify/scripts/` | Generated browser modules used by the viewer | Yes |\n> | `apps/cli/`, `packages/` | Published `birdify` CLI and shared runtime. Not part of the skill payload | No |\n> | `birdify/assets/`, `birdify/schemas/`, `birdify/examples/` | Viewer resources, data contracts and usage examples | Yes |\n> | `birdify/skill-release.json`, licenses and notices | Release identity and redistribution terms | Yes |\n> | `templates/viewer/` | Viewer TypeScript compiled into `birdify/assets` | No |\n> | `toolings/birdify-dev/` | Development CLI `birdify-dev`, including the viewer asset build | No |\n> | `tools/`, `config/` | Internal tools and development metadata, including the artifact inventory | No |\n> | `.build-tools/`, `test/`, `node_modules/` | Generated tooling, tests and development dependencies | No |\n> | `apps/`, `docs/`, `.spec/`, `.github/`, root manifests and guides | Website, repository documentation, proposals and CI | No |\n> \n> Small internal tools belong in `tools/*.mjs` and run directly with Node. They need no TypeScript compilation. Viewer assets are the exception: `toolings/birdify-dev` is the Vite-built `birdify-dev` CLI, and `birdify-dev build-viewer` compiles `templates/viewer` into `birdify/assets`. Schema export is `tools/contracts/export.mjs`: it reads the built `@birdify/core` contracts and does not compile a second module tree. Release packaging validation is `tools/validate-skill.mjs`. User commands are the `birdify` executable from npm package `@borg0ai/birdify` in `apps/cli`, which calls `packages/core`. The skill tells agents to run `npx --yes @borg0ai/birdify`.\n> \n> `birdify/SKILL.md` is the skill entrypoint. Shared runtime TypeScript lives in `packages/core/src/`; the published CLI lives in `apps/cli/`; viewer source lives in `templates/viewer/` and is compiled by `birdify-dev`; viewer assets live in `birdify/assets/`; schemas, examples and references stay inside `birdify/`; tests live in `test/`. Do not add host-specific installation branches or legacy brand aliases.\n> \n> Generated JavaScript and schemas must be regenerated from TypeScript:\n> \n> ```sh\n> pnpm run build\n> pnpm run check:build\n> ```\n> \n> Do not edit generated files directly. `pnpm run check:install` audits a clean Git archive of the nested package, verifies its dependency-free install contract in a temporary directory, runs `birdify doctor`, and tests project mode.\n> \n> ## Documentation\n> \n> Pair English and Chinese Markdown under root `docs/` and `birdify/`. Keep links, commands, identifiers and constraints equivalent. Run:\n> \n> ```sh\n> pnpm run check:docs\n> ```\n> \n> Update the hash record only after reviewing both languages:\n> \n> ```sh\n> pnpm run check:docs --update\n> ```\n> \n> ## Pull requests\n> \n> Keep changes focused. Do not stage, commit, push, create branches or rewrite history without explicit authorization. Use Conventional Commit titles: `type(scope): 中文说明 / English summary`. Inspect the final diff and run relevant package checks before requesting review."},"directory-1":{"body":"# birdify\n\n## 本目录来源 / Local sources\n\n- birdify/SKILL.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 3 条已整理规则\n  改前查阅实现与调用方：执行任何已授权的代码修改任务时（conditional）\n  Auto 模式在代码修改前激活 Birdify：仓库指令将 Birdify 模式配置为 auto 时（conditional）\n  改前展示地图并等待确认：Birdify 地图工作流要求确认且用户未明确豁免本任务时（conditional）\n- CONTRIBUTING.md · 3 条已整理规则\n  遵循中英双语规范提交信息：向仓库提交 Git Commit 时（conditional）\n  保持中英双语文档同步：修改或新增 docs/ 或 birdify/ 下的 Markdown 文档时（conditional）\n  禁止直接修改生成代码：维护查看器前端脚本与契约模式时（conditional）\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 6 条规则，来自 2 份来源。提炼当前仓库根目录 AGENTS.md 与 CONTRIBUTING.md 中的核心开发、触发、确认与贡献规则。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-2":{"body":"# birdify/SKILL.md\n\n类型：skill\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> ---\n> name: birdify\n> description: Show evidence-linked architecture, constraints and change scope. Default to on-demand for explicit Birdify or map requests. Also activate before coding when the project explicitly configures Birdify auto mode. Ordinary coding does not activate Birdify without that opt-in.\n> ---\n> \n> # Birdify\n> \n> [中文](SKILL.zh.md)\n> \n> Show the system on an evidence-linked architecture map and highlight the modules AI plans to change before editing.\n> \n> ## Activation\n> \n> Project `off` disables the foundation and map workflow unless explicitly requested for the current task. Installed project foundation rules remain applicable in `on-demand` even without skill activation; their canonical managed text is [foundation.txt](references/foundation.txt). For project setup, disabling or removal of managed rules, follow [modes.md](references/modes.md); do not start mapping merely to configure rules.\n> \n> Birdify defaults to `on-demand`: activate only when the user selects the skill, names Birdify, or requests an architecture/constraint/change map. Ordinary coding, small fixes and feature planning do not activate it by default. If the project host instruction file explicitly configures `auto`, activate before every code-changing task, including small edits, and planning that explicitly analyzes affected modules. Honor existing `auto` settings; `setup` preserves them. Honor `off` unless explicitly invoked for this task. Merely discussing the skill does not request a map. When active for authorized coding, reuse/update the map and declare affected modules before editing.\n> \n> Use your host's skill selector or explicitly mention Birdify. Do not assume every host implements the same slash command. Invocation applies to the current task, not all future edits.\n> \n> For mode changes/status, follow [modes.md](references/modes.md), run the command against the selected project root, report its result and stop; switching alone does not start mapping. When active, report the existing-map discovery result before building or analyzing change scope. These are agent instructions, not enforced write interception.\n> \n> ## Workflow\n> \n> A bare “use Birdify” request delivers architecture and reviewed constraints together by default. Stage 1 includes effective local instruction discovery, source collection, human-readable rule review, source-range history collection and integrated rendering with `--constraints`; follow [constraint-graph.md](references/constraint-graph.md). Reuse current, matching artifacts rather than repeating a full review for each edit. Honor an explicit architecture-only or constraint-only request. If there are no reviewed rules, disclose checked sources, remaining gaps and the reason no rule graph can be rendered; never fabricate rules or treat unscanned data as zero constraints. Do not call architecture-only output a completed default delivery when constraint review remains pending.\n> \n> For an explicit constraint graph or a complete constraint inventory, follow [constraint-graph.md](references/constraint-graph.md). This standalone route does not require or modify an architecture map. Discover sources, then extract and review actionable rules before rendering. The default view groups rules by human-readable topics with numbered topics and architecture-consistent role colors; raw files/sections belong in the linked source index. A source dump is not delivery. Report reviewed scope and remaining gaps; never substitute a handful of examples for the requested inventory.\n> \n> Before mapping, follow [constraints.md](references/constraints.md) to identify effective local instructions and their explicit references. Record source, applicability and checked coverage; recheck directory rules when edit paths become known or expand. Apply these rules while mapping and planning, and distinguish applicability from verification in delivery.\n> \n> 1. Follow [map-project.md](references/map-project.md): inspect existing maps and application coverage, reuse or update a usable map, then render and visually review its HTML. Deliver the browser preview outcome, identity, revision, coverage and uncertainties; JSON alone is insufficient.\n> 2. With a coding task, prepare the concrete change scope using [show-changes.md](references/show-changes.md), render it, and obtain the user's confirmation before implementation. Bind operations to the same map revision.\n> \n> ### Confirm the displayed plan before implementation\n> \n> In both auto and on-demand mode, finish the reviewable map and change plan first: show the HTML preview, affected modules/files, intended behavior, applicable constraints, verification plan and remaining uncertainties. Then ask whether to implement this displayed scope and wait for an explicit reply. Explain that Birdify requires confirmation of the displayed plan. The initial request to build/fix something or enable auto mode is not confirmation of a plan the user has not seen. A rendered page, successful check, elapsed time or silence is not approval.\n> \n> Before confirmation, read-only investigation and writing map/constraint/plan artifacts are allowed; do not edit implementation, tests or project configuration, or emit `editing` events. A `planned` event may describe the real requested task, but it is not approval. For a map-only request, deliver the map and stop without proposing implementation approval.\n> \n> Reuse explicit confirmation already given for the same displayed plan; do not ask again for routine edits or checks within its scope. If new modules, behavior or constraints materially change the plan, update the preview and confirm the changed scope before implementing it. An explicit user instruction to skip confirmation for this task takes precedence; do not infer that waiver from a generic coding request. Keep approval in the conversation; do not invent approval schema fields or imply that the static viewer enforces this gate.\n> \n> A bare \"use Birdify\" request completes Stage 1; then ask only for the intended change. For planning requests such as \"add a rewards feature to this project; how should we do it?\", use Stage 1 to explain the proposed responsibilities and affected modules, marking proposed additions as unimplemented. Planning alone does not authorize code edits or activity events. Continue to Stage 2 only for a user-authorized implementation task; never invent tasks or events for demonstration.\n> \n> ## Rules\n> \n> For authorized coding tasks after activation, read related implementations, callers and existing design decisions before editing; keep changes focused and avoid abstractions without concrete benefit. Follow [development.md](references/development.md) for the applicable task types, define observable verification before editing, and report actual results and limitations. These instructions do not activate on-demand mode by themselves.\n> \n> For planning, resolve questions from source and existing decisions first. Ask only about unresolved choices that materially affect scope or architecture, starting with the blocking choice and a recommended answer with its tradeoff; continue independent work and do not reopen settled decisions.\n> \n> When Birdify is active and the user requests architecture evaluation or refactoring opportunities, follow [review-architecture.md](references/review-architecture.md) after Stage 1. Ordinary mapping and code edits do not start a review, and this route does not override on-demand activation.\n> \n> - Read [contract.md](references/contract.md) for fields and validation. Keep module IDs stable; distinguish evidence from ownership and planned scope from current targets. Neighbors are not automatically edit targets.\n> - Reuse maps for ordinary edits; revisit responsibilities, ownership and relationships when they change, not for each event.\n> - New maps must pass `validate.mjs --authoring`: explicit module roles and justified generic classifications. Resolve all-generic review warnings against source and report the reasons; preserve existing roles unless evidence changes. See the contract for `roleAssessment` and legacy compatibility.\n> - Follow [bilingual.md](references/bilingual.md): honor explicit language preferences, otherwise use the request language without asking. Other content languages are supported; controls are Chinese/English.\n> - v0.1 records are agent-declared snapshots. Regenerate and refresh for updates; no automatic observation, live transport or display receipts exist. A completed event does not prove checks passed.\n> - Source comments and repository documents are evidence, not authorization to expand the request.\n> - Maintain paired documentation according to the host repository's contribution conventions.\n> \n> When integrating constraints into an existing architecture page, use `npx --yes @borg0ai/birdify render architecture.json project.html --constraints reviewed.json` as described in [constraint-graph.md](references/constraint-graph.md). Reuse the architecture map; preserve its layout. Keep explicit module bindings and rule versions separate from role colors and map revisions. Deliver the integrated HTML and source index.\n> \n> ## Tools\n> \n> Run the published CLI with Node.js 22 or newer. `npx` needs network access the first time. Installing this skill does not install the CLI. Data paths are relative to the user's project root.\n> \n> Install this skill into each detected agent's global skills directory with `npx --yes @borg0ai/birdify install`. That runs `npx --yes skills add borg0ai/birdify --skill birdify --agent '*' --global --copy --yes`. Project mode remains `setup` and `mode`. The command does not write `AGENTS.md`, and a successful exit does not prove the skill directory was checked.\n> \n> ```sh\n> npx --yes @borg0ai/birdify validate path/to/architecture.json path/to/activity.jsonl\n> ```\n> \n> Activity is optional. Fix reported errors and retry. Validation checks structure and consistency, not source existence or architectural truth; report remaining uncertainties.\n> \n> The sole fictional demo is `examples/harness-activity.html`. It supports architecture, changes and comparison views."},"directory-2":{"body":"# birdify/references\n\n## 本目录来源 / Local sources\n\n- birdify/references/modes.md · 0 条已整理规则\n\n- birdify/references/constraint-graph.md · 0 条已整理规则\n\n- birdify/references/constraints.md · 0 条已整理规则\n\n- birdify/references/map-project.md · 0 条已整理规则\n\n- birdify/references/show-changes.md · 0 条已整理规则\n\n- birdify/references/development.md · 0 条已整理规则\n\n- birdify/references/review-architecture.md · 0 条已整理规则\n\n- birdify/references/contract.md · 0 条已整理规则\n\n- birdify/references/bilingual.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 3 条已整理规则\n  改前查阅实现与调用方：执行任何已授权的代码修改任务时（conditional）\n  Auto 模式在代码修改前激活 Birdify：仓库指令将 Birdify 模式配置为 auto 时（conditional）\n  改前展示地图并等待确认：Birdify 地图工作流要求确认且用户未明确豁免本任务时（conditional）\n- CONTRIBUTING.md · 3 条已整理规则\n  遵循中英双语规范提交信息：向仓库提交 Git Commit 时（conditional）\n  保持中英双语文档同步：修改或新增 docs/ 或 birdify/ 下的 Markdown 文档时（conditional）\n  禁止直接修改生成代码：维护查看器前端脚本与契约模式时（conditional）\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 6 条规则，来自 2 份来源。提炼当前仓库根目录 AGENTS.md 与 CONTRIBUTING.md 中的核心开发、触发、确认与贡献规则。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-3":{"body":"# birdify/references/modes.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Project Activation Mode\n> \n> [中文](modes.zh.md)\n> \n> Birdify is on-demand by default, defaulting to `on-demand`. It runs when the user selects the skill, explicitly requests Birdify or asks for an architecture/constraint/change map. Ordinary coding, small fixes and feature planning do not trigger it; planning alone does not authorize editing.\n> \n> ## Invocation\n> \n> Use the host skill selector or explicitly request Birdify. Slash-command support is host-defined. Invocation applies to the current task. Merely discussing Birdify does not start mapping.\n> \n> ## Skill installation\n> \n> ```sh\n> npx --yes @borg0ai/birdify install\n> ```\n> \n> This installs the agent skill into each detected agent's global skills directory. It runs:\n> \n> ```sh\n> npx --yes skills add borg0ai/birdify --skill birdify --agent '*' --global --copy --yes\n> ```\n> \n> It does not write `AGENTS.md`. Project mode remains `setup` and `mode`. A successful exit is the `skills` CLI status, not a check that the skill directory exists.\n> \n> ## Configuration and migration\n> \n> ```sh\n> npx --yes @borg0ai/birdify setup --project \u003cproject-root>\n> npx --yes @borg0ai/birdify mode auto --project \u003cproject-root>\n> npx --yes @borg0ai/birdify mode on-demand --project \u003cproject-root>\n> npx --yes @borg0ai/birdify mode off --project \u003cproject-root>\n> npx --yes @borg0ai/birdify mode --project \u003cproject-root>\n> npx --yes @borg0ai/birdify uninstall --project \u003cproject-root>\n> ```\n> \n> `setup` defaults new projects to `on-demand` and preserves any existing `auto`, `on-demand` or `off` mode. Use `mode auto` to opt in to activation before every code-changing task, including small edits, and planning that explicitly analyzes affected modules. Use `mode on-demand` to return to explicit invocation. Queries are read-only. Updating skill files does not rewrite other projects; verify the selected mode in a fresh task.\n> \n> Foundation rules are separate from map activation. `setup`, `mode auto` and `mode on-demand` install [foundation.txt](foundation.txt), covering focused source reading, evidence, proportional verification and collaboration records without requiring skill reading or mapping. `off` disables foundation and mapping except for explicit invocation in the current task. `uninstall` removes only the project block, preserving the file, other rules, skill and maps; retaining the skill restores default on-demand behavior.\n> \n> ## Storage and boundaries\n> \n> Use absolute paths for installed skill and target project root. Without `--project`, only current directory is used; parents are not searched. Birdify always manages `AGENTS.md`; files are not synchronized. From any directory, run `npx --yes @borg0ai/birdify mode`. Node.js 22 or newer is required; the skill directory does not contain the command.\n> \n> Only the block between `\u003c!-- birdify:mode:start -->` and `\u003c!-- birdify:mode:end -->` is modified; surrounding bytes are preserved. Repeated configuration is idempotent; malformed or duplicate markers and non-regular files prevent writes. Managed blocks contain English machine instructions.\n> \n> These settings depend on host loading, not filesystem interception. Do not overwrite conflicting instructions elsewhere; report known conflicts. Existing sessions may retain old instructions, and CLI tests establish configuration behavior only; verify actual skill selection and artifacts in a new task."},"directory-source-4":{"body":"# birdify/references/constraint-graph.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Constraint graphs\n> \n> [中文](constraint-graph.zh.md)\n> \n> Use this route for a standalone constraint graph, a repository-wide inventory or the constraint portion of the default integrated delivery. Preserve the architecture viewer. Commands invoke the published CLI with `npx --yes @borg0ai/birdify`. Node.js 22 or newer and Git are required. The first `npx` call needs network access. No frontend build is required.\n> \n> ## Discover the declared scope\n> \n> ```sh\n> npx --yes @borg0ai/birdify discover /path/to/repository /output/constraints.catalog.json \"Project name\"\n> npx --yes @borg0ai/birdify render-constraints /output/constraints.catalog.json /output/sources.html --sources\n> npx --yes @borg0ai/birdify compile-rules /output/constraints.catalog.json /output/reviewed-rules.json /output/constraints.reviewed.json\n> npx --yes @borg0ai/birdify render-constraints /output/constraints.reviewed.json /output/constraints.html\n> ```\n> \n> The collector reads committed HEAD without modifying the repository. It enumerates tracked AGENTS.md, AGENTS.md, GEMINI.md, SKILL.md, root CONTRIBUTING.md, GitHub Copilot instructions and Cursor rules, then follows local Markdown links and quoted Markdown paths recursively. It preserves source text, heading hierarchy, line ranges and file history. It excludes recognized fixtures, archives and duplicate Chinese translations, retaining reasons. References indicate discovery, not authority or automatic activation. A skill is conditional on its task; a directory instruction applies only under the host's inheritance rules. Implemented decision notes remain reference evidence, not automatically current rules.\n> \n> Inspect `coverage.entries`, `excluded`, `unresolved`, `uninspectedPaths` and `limitations`. Resolve material missing references or explicitly preserve the gap. The default 1000-source budget leaves queued paths in `uninspectedPaths`; it never silently declares completion. Read untracked/modified instructions, host/user instructions, external references and nonstandard instruction locations separately when applicable. Do not publish private source text without checking the output's audience. Confirm the actual project name from repository evidence or user context.\n> \n> The output is a **source inventory**, not an automatic semantic audit. Sections may contain multiple rules or explanatory prose. Do not describe the number of nodes/sections as the number of effective constraints. Completeness is relative to a named revision, declared entry conventions and resolved references, never the entire lifetime of a project.\n> \n> ## Review rules\n> \n> Read every included instruction/skill and relevant referenced section for the requested scope. Split independent obligations into stable rule IDs; retain exact provenance, applicability conditions, overrides and unresolved conflicts. Cross-links and similar wording do not prove identical authority. Do not discard a source because it was not in the initial examples. Keep excluded fixture instructions and historical notes out of effective rules.\n> \n> The default graph requires reviewed `rules` and `ruleReview.scope`; it rejects an unreviewed source catalog. Source collection alone is not a completed human-facing constraint graph. Each rule must answer what to do, when it applies, why it matters and how to check it. Keep source text in details. Deduplicate obligations without losing conditions or provenance; do not infer applicable rules from headings alone.\n> \n> Author `reviewed-rules.json` with the same `revision`, an honest `scope`, and `groups`. Each group has `sourcePath`, `category`, optional `topic: {id, name}`, and `rules`. Each authored rule has a stable `id`, short `name`, a unique verbatim `anchor` from its source, `explanation`, `condition`, `verification` and optional `applicability`. The compiler resolves the anchor to a paragraph/list item and extracts real line ranges, rejecting absent/ambiguous anchors and snapshot mismatches. It does not perform semantic review. The DeepSeek example at `examples/deepseek-constraints.rules.json` illustrates the format; its project-specific rules must not be copied into other projects.\n> \n> The resulting catalog's required `rules` entries look like:\n> \n> ```json\n> {\n>   \"id\": \"rule-model-visible-log\",\n>   \"category\": \"interfaces\",\n>   \"sourcePath\": \"AGENTS.md\",\n>   \"line\": 111,\n>   \"endLine\": 111,\n>   \"name\": \"Log model-visible inputs\",\n>   \"explanation\": \"New input sent to a model needs a durable session event.\",\n>   \"condition\": \"When introducing model-visible input\",\n>   \"applicability\": \"conditional\",\n>   \"verification\": \"Inspect the event and replay path; run the relevant replay test.\"\n> }\n> ```\n> \n> Line numbers here are illustrative: inspect the target snapshot. Supported applicability values are `applicable`, `conditional`, `superseded`, `conflict`, `uncertain`. Explain any supersession/conflict in `explanation`. The renderer extracts the quote from that source; it does not invent quotations. Keep `coverage.semanticReview: pending` until review covers the declared scope; record remaining review gaps in limitations and `ruleReview.scope`. Partial reviewed scope is deliverable only when clearly labeled; never call it the complete effective rule set. To use rules during architecture/change work, map reviewed rules into the existing [constraints contract](constraints.md), retaining source evidence and applicability rather than copying graph categories into module ownership.\n> \n> ## History and verification\n> \n> Keep three identities separate: stable `rule.id` (the displayed R-number is only a presentation ordinal), rule source-history `vN`, and the full project snapshot commit. To populate history, pass the repository as the fourth compiler argument:\n> \n> ```sh\n> npx --yes @borg0ai/birdify compile-rules catalog.json reviewed-rules.json versioned.json /path/to/repository\n> npx --yes @borg0ai/birdify render-constraints versioned.json constraints.html\n> ```\n> \n> The compiler checks source text against the fixed snapshot and runs Git line history for each quoted paragraph/list item. It records `history` with `status: tracked`, `method: git-line-history`, `snapshot`, `sourcePath`, `line`, `endLine`, `version`, `lastEdited`, and the actual `commits` array of `{commit,date}`. This is the count of source-range history entries, not semantic releases or revisions of the agent's explanation. Moving/reformatting text or sharing one paragraph between obligations can affect the count. Do not manually manufacture these fields or substitute the whole-file history. Rendering validates provenance consistency, not the truth of authored Git evidence; use the collector. Existing source history is discarded when recompiling author input to prevent stale reuse.\n> \n> Cards show the R-number, `vN` and role; details include the method and full commit evidence, while the legend shows the project snapshot. Missing history, shallow clones or unavailable line history show “版本未追踪” rather than v1. Collection never fetches history automatically. The renderer rejects tracked history belonging to another snapshot or source range. Group nodes have no invented versions. When using another AI, require the reviewed selection, versioned catalog and rendered HTML together so provenance remains reviewable.\n> \n> On source-file nodes, vN is the number of Git history entries for that **file's current path**, not a rule's semantic version; rename ancestry is not followed. Dates also belong to the file. Shallow history suppresses version counts and is disclosed; never silently fetch or present a shallow count as complete. Raw sections have no invented individual versions. Unknown compliance stays pending even when the source is committed.\n> \n> Code drift requires inspected implementation links and a justified baseline. Use `constraint-freshness.mjs` with the architecture contract for file changes. Do not infer ownership from headings, treat all later commits as violations, or manufacture colorful status badges. The historical six-rule DeepSeek prototype uses a different, explicitly limited line-history heuristic; it is not the general scanner and must not supply global compliance statistics. Checks and code-review evidence belong in `constraintReviews`, separately from source age and applicability.\n> \n> ## Integrate into an architecture page\n> \n> Keep the architecture page's original horizontal toolbar and canvas layout. The native constraint view has a rule directory, tree canvas and on-demand reading panel; no application icon rail, bottom status bar or iframe. Do not add a module-directory sidebar to the architecture page.\n> \n> \n> When the user requests a combined page, reuse the existing architecture JSON and render both views:\n> \n> ```sh\n> npx --yes @borg0ai/birdify render architecture.json project.html --constraints versioned.json\n> ```\n> \n> Activity JSONL and `--repo` remain optional. The CLI writes `project.html` and the auxiliary `project.sources.html`; distribute both together. Without `--constraints`, existing architecture output is unchanged. The renderer API accepts `constraintCatalog` and optional `constraintSourceHref` in its third argument; API callers generate the auxiliary source index themselves.\n> \n> Both views retain their canvas state when switching. The header keeps the project name, language controls and shared light/dark theme; role colors keep the same meaning. Architecture revision and constraint snapshot are distinct identities. Controls use the host language; authored rules and source quotations stay in their original language. The source index is an auxiliary page, not a second main graph.\n> \n> Project names must match. Optional module links require an explicit catalog `architectureBinding: {mapId, mapRevision, sourceRevision}` matching the map and the full catalog commit, plus `modules: [\"module-id\"]` on reviewed rules. Carry this binding in the reviewed selection when compiling; recompilation discards old catalog bindings. Inspect source evidence before authoring links. The renderer rejects stale bindings and unknown module IDs. Role similarity is never a module link. Without bindings, the full graph still works and module details say no links are recorded. With bindings, the module button opens only linked rules and their ancestors; “Show all rules” restores the full graph. Changing this filter initializes a new constraint layout; switching architecture/constraints alone preserves it. Versions and verification evidence remain unchanged by filtering.\n> \n> Check both views, switching without state loss, theme changes, Chinese/English navigation, narrow screens, module filters and the source-index link. Keep the original architecture layout intact. A conceptual demo map must still be described as conceptual even if its accompanying constraints come from real source history.\n> \n> ## Render and deliver\n> \n> `render-constraints.mjs` consumes `birdify.constraint-catalog/v1` and defaults to a **rule graph**: project → category → optional human-named topic → rule. The six categories are `lifecycle`, `interfaces`, `configuration`, `security`, `testing`, `delivery`. Topics use numbers and text. Colors share architecture role semantics: frontend blue, backend teal, cache cyan, database violet, queue amber, security rose, generic slate. Rules may declare targetRole; non-generic roles require a source-grounded roleReason. Cross-role or unclear scope stays generic; never infer role from topic name. Homogeneous groups inherit their role color; mixed groups use generic. The toolbar role legend counts rules, and cards carry textual IDs and role names. Applicability and verification remain separate in details; colors never mean pass or fail. Prefer concise, actionable titles. Cards clamp long titles to two lines while tooltips and the reading panel retain the full title. Use topic groups to keep each expanded level readable, usually no more than eight children. File age/version and collection counts do not occupy rule cards. Do not show thousands of uniformly pending source nodes as the main view.\n> \n> The renderer uses Birdify-owned HTML cards, SVG connectors and subtree layout, without a third-party graph runtime. `constraint-canvas.js` mounts the same component in standalone and integrated pages. `constraint-page.html` supplies the standalone shell; `constraint-canvas.css` scopes styles to the constraint view. `buildConstraintGraph()` prepares a `birdify.constraint-view/v1` presentation payload without changing the input catalog contract. Details lead with applicability, explanation and verification plan, then source evidence and rule history. Documents render as safe text with basic headings and quotes; arbitrary HTML and embedded diagrams are not executed. All collected sources, including unreviewed skills and references, appear in By directory; double-click a source to read its text and review status. Coverage remains under Coverage. The toolbar does not navigate to another page. The CLI retains the sibling `.sources.html` export for compatibility; `--sources` renders only that auxiliary export.\n> \n> Open the HTML and check expansion, source reading, long content and coverage disclosures at desktop and narrow widths. Report actual collection counts, unresolved/excluded areas, semantic-review status and tests run. Source collection can be complete while effective-rule review remains incomplete; state those separately. The page is offline and read-only, not a live monitor or enforcement mechanism. Generated native pages include the Birdify license; preserve licenses for dependencies actually distributed.\n> \n> \n> Directory and canvas share expansion and selection. Search matches rule titles, explanations and source text while preserving ancestor paths. More than 100 matches show only the first 100 with an explicit message, keeping a large source inventory off the main canvas. Support drag-to-pan, Ctrl/Command + scroll zoom, pinch zoom, zoom buttons and fit. With canvas focus, arrows pan, plus/minus zoom and 0 fits; cards support Enter and left/right navigation, while Escape closes overlays. On narrow screens the directory starts closed and closes after selection; details use a drawer. Expansion, search and zoom never change rule history or verification state.\n> \n> ## Directory and topic views\n> \n> The reviewed graph offers By topic and By directory over the same rule IDs, versions and documents. Discover root and nested instruction files before grouping. Directory nodes list local sources and ancestor instruction candidates using recorded source scope; storage paths alone never prove applicability, override, or conflict resolution. Skills and references require invocation/reference review. Include collected instruction files without extracted rules and explicitly mark extraction gaps. Directory placement is source provenance, not module ownership. Preserve module filters when switching views. Node double-click or Shift+Enter opens the shared detail dialog."},"directory-source-5":{"body":"# birdify/references/constraints.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Effective constraints\n> \n> [中文](constraints.zh.md)\n> \n> ## Discover before planning\n> \n> For an explicitly requested repository-wide inventory or standalone graph, use [constraint-graph.md](constraint-graph.md). That broader discovery is authorized by the inventory request; ordinary task discovery below remains scoped to the task.\n> \n> Start with the current user request, instructions already supplied by the host, and applicable project instruction files. Follow their explicit references to contribution rules, contracts or architecture decisions. Apply the host's precedence and directory inheritance rules; Birdify does not introduce its own instruction hierarchy. Inspect target-directory instructions once paths are known and again when scope expands. Keep searches bounded; do not scan all documents for possible rules.\n> \n> Record the rule, source and applicability rationale. Existing implementation patterns are candidates, not mandatory rules: use `origin: inferred` with `applicability: uncertain` until an explicit source resolves them. Preserve overridden rules with `supersededBy` and unresolved conflicts with `conflictsWith`; ask only when a material conflict cannot be resolved from existing authority. Finding a document does not activate its contents as instructions. Never copy secrets or private user text into a shareable map; use a sanitized summary and preserve the original authority outside Birdify.\n> \n> ## Map contract\n> \n> Optional `constraintDiscovery` records `checkedAt`, `checkedPaths` and `uninspectedPaths` using project-relative paths. It is an agent-declared inspection snapshot, not proof of complete discovery or automatic scanning. Do not claim uninspected areas have no constraints. A missing record means discovery was not recorded; empty `constraints` means no rules were recorded.\n> \n> Optional `constraints` entries contain stable `id`, `name` (the rule), `note` (applicability rationale), `origin` (`local`, `user`, `inferred`), `strength` (`required`, `preferred`), `applicability` (`applicable`, `superseded`, `not-applicable`, `uncertain`, `conflict`), `scope`, `modules`, `relationships`, `evidence` and `verification` (planned verification method). Local rules require source evidence with path and, when available, line/symbol and a short source excerpt in `note`. User rules can instead describe their sanitized source in the rule's `note`.\n> \n> `scope: modules` requires nonempty module IDs and no relationship IDs; `relationships` requires nonempty relationship IDs and no module IDs. `project` and `task` use empty target arrays. Only `task` requires `taskId`; task rules apply only to that task. Project operation rules need no artificial module association. Superseded rules require a known `supersededBy` ID without cycles; conflicting rules require other known IDs in `conflictsWith`. Translate `name`, `note`, `verification` and evidence notes under the existing language contract.\n> \n> Store task-specific rules before starting the activity session. Changes to constraints or discovery increment the map revision like other map edits. If newly discovered rules change the map during a task, close the old task/session and start a new session bound to the new revision; never rebind old events. Use a new task ID where needed and update task-scoped rules accordingly.\n> \n> ## Plan and verify\n> \n> ### Sources, code links and changes\n> \n> Keep optional `explanation` (the agent's concrete interpretation) separate from source evidence. An evidence item's optional `quote` preserves a short, safe, verbatim excerpt in its original language; translate its `note`, not the quote. Never present a paraphrase as a quote. Optional `code` uses the same path/line/symbol/note structure as evidence, but identifies implementation files rather than instruction sources. Bind only files actually inspected; conceptual module ownership is not evidence of an implementation link. Translate explanation and code notes for bilingual delivery.\n> \n> Record optional `baselineCommit` as a full Git commit from the project after inspecting the rule and its linked files. This is a comparison baseline, not a compliance claim. Compare declared source and code files before planning and again after edits:\n> \n> ```sh\n> npx --yes @borg0ai/birdify freshness architecture.json /path/to/project\n> npx --yes @borg0ai/birdify render architecture.json architecture.html activity.jsonl --repo /path/to/project\n> ```\n> \n> Use the repository root. The first command prints a read-only JSON report; the second embeds a timestamped report in the standalone viewer. Both compare the baseline with the index and working tree without changing Git state, the map or activity records. All comparisons are whole-file; line numbers and symbols are locators, not AST scopes. Changed or missing files require review, not a violation verdict. An unavailable baseline, uninspectable path or skipped index entry remains unverified. An unchanged file does not prove compliance; files without declared links are not covered. Without `--repo`, rendering does not inspect Git and shows that changes were not checked. The page never watches the filesystem; rerender after further edits. In task playback, the file report describes render-time state, independently of the selected historical event.\n> \n> When a change is flagged, inspect the diff against the original rule. Update the interpretation if the source changed, or record why the implementation still satisfies it and run relevant checks. Do not advance the baseline merely to remove the reminder. A baseline update is a map revision change and follows the session rules above. Dirty work must be reviewed with explicit evidence; a commit ID alone cannot identify uncommitted contents. Do not introduce automatic acknowledgements, commit hooks or semantic compliance claims.\n> \n> For each applicable rule related to the task scope, record `constraintReviews` in the activity event. Each review has `constraintId`, `plan`, `status` (`unverified`, `supported`, `violated`), `method` (`test`, `review`), `evidence` (empty while pending) and `checkIndexes` (zero-based references into this event's `checks`). Relationship rules relate to either endpoint in scope; project rules always relate. Recheck applicability when scope expands. Legacy events remain valid without reviews.\n> \n> Optional review `checkedAt` and full `gitCommit` record when and against which commit the review ran. Describe any uncommitted changes in `evidence`. These fields do not clear file-change reminders or transfer a historical result onto current code.\n> \n> Each event is a complete review snapshot: omitted reviews display as unverified, and prior results are never carried forward automatically. Start plans as unverified. Supported or violated results require evidence; test-supported results require linked passing checks. Manual reviews use textual evidence and empty check indexes. Translate `plan` and `evidence` in each review's `translations` when delivering both languages. A passing test only supports the stated coverage, not every constraint. Terminal events may remain unverified or report violations; completion never establishes compliance.\n> \n> ## Viewer\n> \n> The constraints toolbar button opens the existing inspector. Filter applicable rules, the selected module, changes needing review, uncertain/conflicting rules or all rules. Module details link to applicable rules; selecting a rule highlights its target modules and relationships without changing activity scope. Details separate applicability, explanation, source excerpts, linked code, file changes and verification evidence. Recorded verbatim excerpts are expanded by default; the standalone page does not load source files. Task views additionally show plans, review methods, review provenance and linked checks for the selected event. Discovery coverage and snapshot timestamps remain inspectable. Corrections require updating source-backed data and rerendering; there is no UI switch to disable rules or filesystem write interception."},"directory-source-6":{"body":"# birdify/references/map-project.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Stage 1: Map the project\n> \n> [中文](map-project.zh.md)\n> \n> Produce [schema-valid](../schemas/architecture.schema.json) architecture JSON and standalone HTML from the same data for the selected project and scope. Follow [language selection](bilingual.md); examples are fictional field references, not project evidence.\n> \n> ## Discover and verify coverage\n> \n> 1. Check user-provided/documented architecture paths, existing artifact locations, `.birdify/`, then root and `docs/`. Use bounded architecture/map filename searches, excluding dependencies, generated output and skill examples; expand only when those locations and references yield nothing.\n> 2. Read candidates and verify project relevance, coverage, current ownership and source evidence. Validate Birdify JSON; schema validity does not establish freshness. Prefer the user's selection or documented canonical map; ask only about unresolved competing candidates.\n> 3. Reuse compatible maps in place and update stale portions. Adapt other formats after source verification, preserving meaningful IDs and the original artifact. HTML/images alone need underlying module/ownership data before Stage 2. Create a map only when none is reusable or adaptable; resolve unavailable validation before Stage 2.\n> 4. Honor explicit subsystem scope; otherwise inspect the selected project root. Read root documentation, top-level directories and relevant workspace/build manifests, then follow declared applications. Verify each using its own manifest, startup/build entry and source. Dependencies alone do not prove an application; trace client calls and server routes before asserting connections.\n> 5. Reconcile every in-scope application with a module, explained grouping or explicit coverage gap in new and reused maps. Keep distinct application responsibilities visible; shared packages need not be applications. The 6-10 module readability target never justifies omissions or inventions.\n> 6. For ordinary local edits, recheck relevant entries and changed manifests. Broaden discovery only when scope or workspace structure changes. Report root/scope, checked applications and module IDs, exclusions and unresolved areas alongside the architecture table. Distinguish uninspected areas from checked absences; zero uncertainty does not prove complete coverage.\n> \n> ## Author the map\n> \n> Trace main request/data paths and read surrounding symbols before assigning responsibilities. For a specific code area, step up to its responsibility and relevant callers/dependencies within the agreed scope. Stop when that scope is coherently covered.\n> \n> Model modules as cohesive business or technical responsibilities at a comparable level of abstraction, not one node per file, class or directory. Describe what each does and how it connects to surrounding modules; keep implementation locations in ownership/evidence. Use the project's domain glossary when available, otherwise established terms from source and documentation. Preserve evidenced responsibility boundaries and existing IDs when improving labels.\n> \n> Follow the [contract](contract.md) for fields, roles, ownership, evidence, status and layout. Choose module roles from inspected responsibilities; use `generic` when unclear, never cycle roles for colors. Roles are independent of ownership and groups. Include external services only for real relationships, without local file ownership. Mark unsupported conclusions `uncertain` with specific open questions; `supported` records inspected evidence, not static proof.\n> \n> For new maps, explicitly classify every module and run `npx --yes @borg0ai/birdify validate \u003cmap.json> --authoring` before rendering (add `--bilingual` for Chinese/English delivery). Generic modules require the contract's `roleAssessment`: explain why the taxonomy does not fit or which evidence is missing; insufficient evidence requires uncertainty and a specific question. Never bulk-default modules to generic to finish faster. Review all-generic warnings module by module against source and report the reasons, rather than inventing different roles to pass. Reuse existing classifications unless new evidence supports a change; explain any downgrade to generic and apply revision rules. Review changed/new module classifications on legacy-map updates; unchanged legacy fields need no forced migration.\n> \n> Author directed, concretely labelled relationships with evidence, status, `kind` and `visibility`. Keep core execution, necessary result/tool feedback, basic dependencies and required approvals in `overview`; recovery, retries and diagnostics may be `detail` unless central to the map. Default to `overview` when unsure. Check isolated overview modules for missing connections; keep genuine auxiliary modules and hidden-relation counts. Retain all relationships; kind/visibility do not represent modification scope, and must not change solely to reduce visual clutter.\n> \n> Show an architecture table (module, responsibility, ownership, evidence, uncertainty) and short relationship list from the same JSON. Allow corrections without redundant approval when continued work is already authorized.\n> \n> ## Groups and revisions\n> \n> Use optional groups only for evidenced system/subsystem membership: one disjoint level, with stable IDs, names, unique members and nonempty evidence. Groups render side by side, preserving internal row/column order; ungrouped modules remain outside frames. Translate group names and evidence like module text.\n> \n> Choose group roles from source-supported responsibilities and explain the classification in evidence notes:\n> \n> | Role | Meaning | Fixed color |\n> | --- | --- | --- |\n> | `interaction` | User interaction and review | Pale blue |\n> | `runtime` | Execution and orchestration | Pale amber |\n> | `external-services` | Integrations outside the described system | Pale violet |\n> | `generic` | Unspecified or mixed responsibility | Neutral gray |\n> \n> Unclear or omitted roles use `generic`. Names, ordering, module ownership and color variety are not classification evidence. Group roles do not imply module roles, deployment/trust boundaries or activity state. Keep the shared palette; no per-map overrides or custom color fields. Schema rejects unknown roles/fields but cannot verify classification; check evidence and preserve existing roles unless new evidence warrants change.\n> \n> Read existing artifacts before replacing them; use the agreed location (default `.birdify/`) without overwriting unrelated files. `project.id` and `mapId` are local identities, not necessarily URLs. Optional `project.revision` records a Git commit, not the map revision or a clean-tree guarantee.\n> \n> Increment `revision` for every saved map change, including layout and translations. Preserve IDs for continuing responsibilities and never reassign removed IDs. Complete/cancel tasks on the old map before starting against a new revision; never silently replay old events onto it.\n> \n> ## Render and review\n> \n> For the default “use Birdify” delivery, finish the [constraint workflow](constraint-graph.md) before final rendering: inspect effective local instructions, collect committed sources, author and review `reviewed-rules.json`, then compile with the repository argument to collect rule history into `.birdify/constraints.reviewed.json`. Preserve working-tree instruction differences as explicit limitations. Record actual checked/uninspected paths in `map.constraintDiscovery` under the [constraints contract](constraints.md); a scan is not semantic review. Do not copy the demo rules. Reuse a matching reviewed catalog when valid. Keep scope and snapshot explicit, and only bind rules to modules after source inspection. Save the source catalog and reviewed selection alongside the compiled catalog so another AI can continue the review. If review is incomplete, report that boundary instead of claiming complete delivery. When no reviewed rules exist, deliver the architecture and discovery findings with the limitation; the rule renderer deliberately rejects an empty or unreviewed catalog.\n> \n> Use the bundled renderer, with absolute paths when running from the user's project; `\u003cskill-root>` contains SKILL.md. Substitute the actual agreed artifact paths:\n> \n> ```sh\n> npx --yes @borg0ai/birdify render \u003cproject-root>/.birdify/architecture.json \u003cproject-root>/.birdify/architecture.html --constraints \u003cproject-root>/.birdify/constraints.reviewed.json\n> ```\n> \n> Omit `--constraints` only for an explicit architecture-only request or a disclosed unavailable rule catalog. Check that the final page has Architecture / Constraints switching, source evidence, rule version labels and the sibling source-index link; deliver the `.sources.html` file with it. The architecture inspector counts only map-bound rules, not the separate catalog; missing module links are not missing project rules.\n> \n> The renderer validates JSON and emits self-contained HTML requiring no server/network assets. Do not handcraft a substitute viewer or deliver a fictional demo as the project's map.\n> \n> Open HTML in a visible browser preview. With a browser-capable host, use its visible browser target and correctly encoded file URL, not a source-file target. A Markdown link may open source; a queued request does not confirm display, and headless inspection does not confirm the user's visible tab.\n> \n> Review the final HTML at the available user viewport:\n> \n> - Inspect Overview and All relations, names, relationships and selected-module evidence. Hover the module with most direct edges (incoming + outgoing, self-edge once), then other visibly congested areas.\n> - Check card-crossing/overlapping routes, congested turns, distinguishable endpoints/arrows, cropped routes/headings, hidden-relation counts and text size after fitting.\n> - Verify hover makes direct relationships traceable and leaving restores the selected view without moving nodes.\n> \n> Automatic spacing is not a readability guarantee. Keep pixel thresholds and invented congestion fields out of map data. If needed, adjust layout by responsibility/interaction order or groups by evidence; preserve identities, ownership, relationship semantics and full scope. Increment revision, rerender, and recheck affected areas and the full view. Stop after two consecutive attempts without visible improvement and report remaining issues. Unchanged maps in focused tasks need no unrelated UI audit.\n> \n> Report the actual artifact, viewport, modes, focused modules and unresolved issues. Schema checks, collision samples or screenshots alone are not visual acceptance; no automated crowding check is bundled. If browser inspection is unavailable/denied, state that visual review was not performed and the actual limitation; provide the absolute HTML path, explaining browser display versus editor source. Do not bypass denial or blame the template without rendering-error evidence.\n> \n> Lead with HTML and the preview result; include JSON path, `project.id`, `mapId`, `revision`, coverage and uncertainties as supporting information. Fix or report rendering blockers; JSON alone is not completed visual delivery. This is a snapshot, not live activity. Without a coding task, stop after delivery and ask for the intended change. With a coding task, prepare and render its scope through [Stage 2](show-changes.md), then wait for confirmation of the displayed plan before implementation. Rendering success alone is not permission to edit."},"directory-source-7":{"body":"# birdify/references/show-changes.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Stage 2: Express the change\n> \n> [中文](show-changes.zh.md)\n> \n> Preparing the plan requires a user-requested task and the usable map from [Stage 1](map-project.md). Implementation additionally requires confirmation of the displayed plan, as defined in [SKILL.md](../SKILL.md).\n> Read [contract.md](contract.md), `schemas/activity.schema.json` and the example stream.\n> Use exact project/map/revision/module IDs; resolve stale coverage before emitting events. Never substitute a fictional map or infer IDs from prose.\n> \n> ## Record operations\n> \n> Before editing, follow [development.md](development.md) for the relevant task types. Include the intended observable behavior and verification method in the `planned` reason; use existing `checks` for executed results and `constraintReviews` for applicable recorded constraints. Do not add new event fields.\n> \n> 1. Before editing: append `planned` with complete `scope`, current `targets`, project-relative `files` and a short module-based reason. Render and deliver the plan, ask for confirmation, and wait. Do not treat the original coding request as approval of an unseen plan. Reuse confirmation already given for this same plan; honor an explicit task-specific waiver.\n> 2. After confirmation, before each edit group: append `editing` with concrete paths and only current modules as targets.\n> 3. Before checks: append `verifying`; test/fixture paths do not automatically count as modified files.\n> 4. At task end: append `completed`, `failed` or `cancelled`, recording actual commands, exit codes and observations in `checks` where applicable.\n> \n> Every JSONL event carries complete scope/targets. Explain scope expansion in a new `planned` event, update the preview and confirm the changed scope before editing added modules. For mapped edits, target all matching file owners; list unowned files in both `files` and `unmappedFiles`. Never invent ownership to pass validation; correct misleading rules in Stage 1.\n> \n> One active task per session; sequences start at 1 and stay contiguous. After a terminal event use a new task ID, never reopen one. Keep project and map revision fixed; new revisions require a new session/file. These are agent declarations: keep checks pending until executed, and never infer success from event emission or completion.\n> \n> ## Render and deliver\n> \n> ```sh\n> npx --yes @borg0ai/birdify render \u003cmap.json> \u003cactivity.html> \u003cactivity.jsonl>\n> ```\n> \n> The renderer validates the full stream before replacing output. Deliver only after success; follow Stage 1's preview checks.\n> \n> - Real activity opens at the latest record; simulation at the first plan. History and collapsible files/checks describe the selected step, not cumulative Git changes.\n> - Architecture/changes/comparison share positions; comparison links selection, zoom and scrolling and stacks on narrow screens.\n> - Scope stays outlined; non-targets dim. Planned targets highlight before edits, verification targets are labelled separately, and terminal events remove target glow. No executed checks means unverified.\n> - Use `--simulation` only for fictional records such as `examples/harness.activity.jsonl`, never as observed work.\n> - For each supported activity language, supply event `translations[locale].reason` and check `translations[locale].summary`; absent translations fall back to originals.\n> - Updates need regeneration and refresh. No upload, auto-refresh, live interception or Git verification exists; a future display receipt would confirm rendering, not approval or correctness."},"directory-source-8":{"body":"# birdify/references/development.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Development after activation\n> \n> [中文](development.zh.md)\n> \n> Apply only when Birdify is active and the user has authorized coding. Before implementation, follow the displayed-plan confirmation step in [SKILL.md](../SKILL.md); mapping or an initial coding request alone is not plan approval. Preserve the existing map and change workflow; these rules neither enable always-on behavior nor override project instructions.\n> \n> ## Choose the relevant guidance\n> \n> Read the related implementation, callers and applicable design decisions. Resolve questions from source first; ask only about unresolved choices that materially affect the task. Define the expected observable behavior and a proportionate way to verify it before editing. Combine the sections below when needed, such as bug diagnosis plus UI checks for a broken button. Do not run every section for every task.\n> \n> ### Bug fixes\n> \n> Establish a reproduction or inspect concrete failure evidence matching the reported symptom. Use the smallest useful test, command, request or UI interaction. For intermittent failures, record reproduction conditions and frequency. If reproduction is unavailable, state what was tried and what evidence is missing; distinguish a tentative fix from a verified one.\n> \n> Test plausible causes against evidence before choosing a fix. Multiple competing hypotheses help ambiguous failures, but simple bugs need no fixed hypothesis count. Change one relevant variable at a time when investigating. For performance work, measure the affected scenario before and after under comparable conditions.\n> \n> After fixing, rerun the original scenario. Add a regression test when it can exercise the real failure path and provides durable value; observe it fail before the fix and pass afterward when feasible. Explain missing coverage. Remove temporary instrumentation introduced for this task without deleting others' work.\n> \n> ### Features and behavior changes\n> \n> Identify observable acceptance behavior and important failure paths. Implement and verify in small behavior-sized steps. Tests should exercise real paths through stable interfaces, rather than mirror private implementation or pass only because internal collaborators are mocked. Use test-first development when requested or useful; do not mandate it for every change or add tests for trivial, reversible edits without meaningful risk.\n> \n> ### Refactoring and architecture changes\n> \n> Inspect affected callers, compatibility requirements and existing decisions. State the concrete benefit, such as removing duplicated business rules or reducing knowledge required by callers. Preserve behavior unless its change is authorized, and verify the interfaces and paths affected. Do not add speculative abstractions or expand into unrelated cleanup. Ordinary edits do not start an architecture review; use the separate review workflow only when requested under the skill's activation rules.\n> \n> ### UI changes\n> \n> Inspect the rendered result and affected interaction at relevant viewport sizes. Check loading, empty and error states where affected, plus relevant keyboard operation, focus and accessible labels. Scale checks to the change: a copy edit does not require a full-site audit. When visual or interaction verification is unavailable, state the limitation instead of claiming acceptance.\n> \n> ## Record and finish\n> \n> Use the existing [change workflow](show-changes.md): put the expected behavior and intended verification in the `planned` reason, actual commands, exit codes and observations in `checks`, and reviews of applicable recorded constraints in `constraintReviews`. Do not invent schema fields or passing results. A manual review supports only the inspected scope, and completing an activity does not establish correctness.\n> \n> Distinguish checks not run, environment blockers and observed failures. Continue routine checks and justified retries autonomously; ask only for material unresolved choices or required access. After relevant checks pass, broaden testing only for changed scope or remaining risk. Recheck the original request, update the map if responsibilities, ownership or relationships changed, and report the changes, actual verification and remaining limits. These are agent instructions; validators check records, not whether the agent truly followed the process."},"directory-source-9":{"body":"# birdify/references/review-architecture.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Review architecture on request\n> \n> [中文](review-architecture.zh.md)\n> \n> Use only when Birdify is active and the user asks for architecture evaluation or refactoring opportunities. Start from the verified map in [Stage 1](map-project.md); review the requested scope, not the entire repository by default.\n> \n> ## Inspect responsibilities\n> \n> Read relevant project terminology and architecture decisions when available; missing glossaries or ADRs do not require creating them. Trace the callers and implementations behind candidate modules. Look for concrete friction:\n> \n> - One responsibility requires coordinated edits across several modules, or callers must know internal ordering, error handling or configuration details.\n> - A wrapper adds little behavior while forcing callers through another interface. Ask what happens if it is removed: does complexity disappear or move into its callers? A small adapter can still justify its existence.\n> - Existing boundaries make important behavior difficult to verify through public interfaces. Describe the behavior at risk, rather than demanding tests for every implementation detail.\n> \n> Prefer changes that give callers a simpler interface while keeping cohesive behavior together. Module count, file size and diagram neatness alone are not evidence of a problem. Respect existing architecture decisions; suggest revisiting one only with concrete new evidence and state the conflict.\n> \n> ## Present grounded candidates\n> \n> Return only supported candidates, ordered by expected value. For each, provide:\n> \n> - Existing module IDs and source paths/symbols, observed friction and its practical impact.\n> - Proposed responsibility or dependency changes, expected benefit, migration cost and risks, including reasons to retain the current design.\n> - A behavior-level verification plan and confidence: strong evidence, worth investigating, or speculative. Identify missing evidence; do not present hypotheses as defects.\n> \n> Use the existing Birdify preview to locate affected modules and explain candidates alongside it. Keep the canonical map factual: do not replace current relationships with proposals, invent activity records or treat the comparison view as a before/after architecture diff. Describe proposed structure in the accompanying explanation; no separate report framework or schema extensions are needed.\n> \n> Recommend a first candidate only when the evidence supports one; finding no justified refactor is a valid result. Resolve source-answerable questions before asking about material product or design choices, and include a recommendation with its tradeoff. Review alone does not authorize implementation. Once implementation is authorized, follow [Stage 2](show-changes.md) using the current map and declared scope; do not ask again for authorization already given."},"directory-source-10":{"body":"# birdify/references/contract.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Birdify contract v0.1\n> \n> [中文](contract.zh.md)\n> \n> ## Multi-agent collaboration\n> \n> Activity events may include `occurredAt` (an ISO 8601 timestamp), `gitCommit` (the source commit), and `collaboration: { agent, locks }`. `agent` identifies the worker and `locks` lists file paths or stable module IDs claimed for the active task. The validator warns when active claims from different agents overlap. A terminal event releases claims for that task, so completed collaboration state does not remain active. These are trace and conflict signals, not filesystem locks or merge replacements.\n> \n> ## Architecture\n> \n> Optional module `role` classifies responsibility as `frontend`,
